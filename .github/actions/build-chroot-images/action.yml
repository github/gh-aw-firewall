name: Build cached chroot images
description: Load checkout-built integration images using daily GitHub Actions layer caches
inputs:
  browser:
    description: Include the API proxy image used by browser tests
    default: 'false'
  runner-variant:
    description: Distinguish the browser runner matrix caches
    default: ubuntu-latest
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver: docker

    - name: Expose GitHub Actions cache runtime for Buildx CLI
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
            const value = process.env[name];
            if (!value) throw new Error(`Missing ${name} for Buildx cache`);
            if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
            core.exportVariable(name, value);
          }

    - name: Build and verify local integration images
      shell: bash
      env:
        CHROOT_BROWSER: ${{ inputs.browser }}
        CHROOT_CACHE_VARIANT: ${{ github.job }}-${{ inputs.runner-variant }}-${{ runner.arch }}
      run: bash scripts/ci/build-chroot-images.sh
