updates:
- directory: /
  groups:
    all-npm-dependencies:
      patterns:
      - "*"
  open-pull-requests-limit: 2
  package-ecosystem: npm
  schedule:
    day: monday
    interval: weekly
- directory: /docs-site
  groups:
    all-docs-site-dependencies:
      patterns:
      - "*"
  open-pull-requests-limit: 1
  package-ecosystem: npm
  schedule:
    day: monday
    interval: weekly
- directory: /containers/agent
  groups:
    all-docker-agent:
      patterns:
      - "*"
  open-pull-requests-limit: 1
  package-ecosystem: docker
  schedule:
    day: monday
    interval: weekly
- directory: /containers/squid
  groups:
    all-docker-squid:
      patterns:
      - "*"
  open-pull-requests-limit: 1
  package-ecosystem: docker
  schedule:
    day: monday
    interval: weekly
- directory: /containers/router
  groups:
    all-uv-router:
      patterns:
      - "*"
  open-pull-requests-limit: 1
  package-ecosystem: uv
  schedule:
    day: monday
    interval: weekly
- directory: /containers/router
  groups:
    all-docker-router:
      patterns:
      - "*"
  ignore:
  # Stay on the Python minor version that the router supports; patch and digest updates still apply.
  - dependency-name: "python"
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  open-pull-requests-limit: 1
  package-ecosystem: docker
  schedule:
    day: monday
    interval: weekly
- directory: /
  groups:
    all-github-actions:
      patterns:
      - "*"
  ignore:
  - dependency-name: "github/gh-aw-actions/**"
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  open-pull-requests-limit: 1
  package-ecosystem: github-actions
  schedule:
    day: monday
    interval: weekly
version: 2
