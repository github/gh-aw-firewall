name: Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/

jobs:
  build:
    name: Build and Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Verify model information sources and generated assets
        run: npm run models:check

      - name: Test privileged audit publication
        if: matrix.node-version == '20'
        run: sudo "$(command -v node)" node_modules/jest/bin/jest.js --runInBand src/resolved-config-artifact-linux.test.ts

      - name: Verify build output
        run: |
          # Verify dist directory exists
          if [ ! -d "dist" ]; then
            echo "::error::Build output directory 'dist' not found"
            exit 1
          fi
          
          # Verify main entry point exists
          if [ ! -f "dist/cli.js" ]; then
            echo "::error::Main entry point 'dist/cli.js' not found"
            exit 1
          fi
          
          echo "Build verification successful"
          ls -la dist/

      - name: Run API proxy unit tests
        run: |
          cd containers/api-proxy
          npm ci
          npm test

      - name: Check reflect smoke fixture and grader without providers
        if: matrix.node-version == '22'
        run: npm run test:reflect-smoke

      - name: Run CLI proxy unit tests
        env:
          AWF_TEST_GH_CLI: /tmp/awf-gh-cli-2.98.0/bin/gh
        run: |
          cd containers/cli-proxy
          GH_VERSION="$(sed -n 's/^ARG GH_VERSION=//p' Dockerfile)"
          test "$GH_VERSION" = "2.98.0"
          GH_ARCHIVE="gh_${GH_VERSION}_linux_amd64.tar.gz"
          GH_DIR="/tmp/awf-gh-cli-${GH_VERSION}"
          mkdir -p "$GH_DIR"
          curl -fsSL --retry 3 "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${GH_ARCHIVE}" -o "/tmp/${GH_ARCHIVE}"
          echo "3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de  /tmp/${GH_ARCHIVE}" | sha256sum --check
          tar -xzf "/tmp/${GH_ARCHIVE}" -C "$GH_DIR" --strip-components=1
          npm ci
          npm test

      - name: Run shell unit tests
        if: matrix.node-version == '20'
        run: |
          bash tests/setup-iptables-port-spec.test.sh
          bash tests/cli-proxy-probe-classify.test.sh
          bash tests/usr-local-bin-shim.test.sh
