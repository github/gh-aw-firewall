name: NVX Phase 3f Promotion Evidence

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/nvx-phase-3b-live-kvm.yml'
      - 'src/nvx/**'
      - 'src/container-runtime.ts'
      - 'src/container-runtime.test.ts'
      - 'src/microvm/**'
      - 'scripts/ci/nvx-manager-live-evidence.ts'
      - 'docs/nvx-security-design.md'

permissions:
  contents: read
  copilot-requests: write
  id-token: write
  attestations: write

concurrency:
  group: nvx-phase-3f-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attested-artifacts:
    name: Build workflow-attested NVX artifacts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'nvx-live-kvm'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Fetch and verify pinned NVX release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVX_RELEASE: v0.1.0-dev.d561c4300ebe
          NVX_ARCHIVE: nvx-0.1.0-linux-kvm.tar.gz
          NVX_ARCHIVE_SHA256: 705c863cf7183e89606542b12961644eefd24fed8b2520156dd5cb63a3982699
          SIGNER_WORKFLOW: github/gh-aw-firewall/.github/workflows/nvx-phase-3b-live-kvm.yml
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/nvx-package"
          artifact_dir="$RUNNER_TEMP/nvx-attested-artifacts"
          mkdir -p "$package_dir" "$artifact_dir"
          gh release download "$NVX_RELEASE" \
            --repo microsoft/nvx \
            --pattern "$NVX_ARCHIVE" \
            --dir "$package_dir"
          printf '%s  %s\n' \
            "$NVX_ARCHIVE_SHA256" \
            "$package_dir/$NVX_ARCHIVE" |
            sha256sum --check --status
          tar -xzf "$package_dir/$NVX_ARCHIVE" -C "$package_dir"
          extracted="$package_dir/nvx-0.1.0-linux-kvm"
          (
            cd "$extracted"
            sha256sum --check SHA256SUMS
          )
          install -m 0555 "$extracted/bin/openvmm" "$artifact_dir/openvmm"
          install -m 0444 "$extracted/guest/vmlinux" "$artifact_dir/vmlinux"
          install -m 0444 \
            "$extracted/guest/initramfs.cpio.gz" \
            "$artifact_dir/initramfs.cpio.gz"
          release_tag="v$(node -p "require('./package.json').version")"
          jq -n \
            --arg release_tag "$release_tag" \
            --arg source_commit "$GITHUB_SHA" \
            --arg signer_workflow "$SIGNER_WORKFLOW" \
            --arg openvmm_sha "$(sha256sum "$artifact_dir/openvmm" | cut -d' ' -f1)" \
            --arg kernel_sha "$(sha256sum "$artifact_dir/vmlinux" | cut -d' ' -f1)" \
            --arg initramfs_sha "$(sha256sum "$artifact_dir/initramfs.cpio.gz" | cut -d' ' -f1)" \
            --argjson openvmm_size "$(stat -c %s "$artifact_dir/openvmm")" \
            --argjson kernel_size "$(stat -c %s "$artifact_dir/vmlinux")" \
            --argjson initramfs_size "$(stat -c %s "$artifact_dir/initramfs.cpio.gz")" \
            '{
              schemaVersion:2,
              release:{
                repository:"github/gh-aw-firewall",
                workflow:$signer_workflow,
                tag:$release_tag,
                sourceCommit:$source_commit
              },
              upstream:{
                releaseTag:"v0.1.0-dev.d561c4300ebe",
                nvxCommit:"d561c4300ebe854baba5d154056ead6f9d462047",
                openvmmCommit:"0bc357bbcf3a654b63dfb51f1103c5751bf3d31f"
              },
              architecture:"x86_64",
              artifacts:{
                openvmm:{file:"openvmm",sizeBytes:$openvmm_size,sha256:$openvmm_sha},
                kernel:{file:"vmlinux",sizeBytes:$kernel_size,sha256:$kernel_sha},
                initramfs:{
                  file:"initramfs.cpio.gz",
                  sizeBytes:$initramfs_size,
                  sha256:$initramfs_sha
                }
              }
            }' > "$artifact_dir/manifest.json"

      - name: Attest pinned NVX artifact manifest
        id: attest_nvx_manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/nvx-attested-artifacts/manifest.json

      - name: Bundle manifest attestation
        env:
          BUNDLE_PATH: ${{ steps.attest_nvx_manifest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" \
            "$RUNNER_TEMP/nvx-attested-artifacts/manifest.sigstore.jsonl"

      - name: Upload attested NVX artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nvx-attested-artifacts
          path: ${{ runner.temp }}/nvx-attested-artifacts/
          if-no-files-found: error
          retention-days: 7

  live-kvm-evidence:
    name: Live Linux x86_64 KVM evidence
    needs: build-attested-artifacts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'nvx-live-kvm'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            acl bubblewrap e2fsprogs erofs-utils jq nftables uidmap

      - name: Download attested NVX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nvx-attested-artifacts
          path: ${{ runner.temp }}/nvx-attested-artifacts

      - name: Fetch pinned NVX source
        env:
          NVX_COMMIT: d561c4300ebe854baba5d154056ead6f9d462047
          NVX_OPENVMM_COMMIT: 0bc357bbcf3a654b63dfb51f1103c5751bf3d31f
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/nvx-source"
          git clone --filter=blob:none --no-checkout \
            https://github.com/microsoft/nvx.git "$source_dir"
          git -C "$source_dir" fetch --depth 1 origin "$NVX_COMMIT"
          git -C "$source_dir" checkout --detach "$NVX_COMMIT"
          git -C "$source_dir" submodule update --init --depth 1 openvmm
          test "$(git -C "$source_dir/openvmm" rev-parse HEAD)" = "$NVX_OPENVMM_COMMIT"

      - name: Probe pinned direct-launch contract
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/nvx-source"
          package_dir="$RUNNER_TEMP/nvx-attested-artifacts"
          chmod 0555 "$package_dir/openvmm"
          test -x "$package_dir/openvmm"
          test -s "$package_dir/vmlinux"
          test -s "$package_dir/initramfs.cpio.gz"
          help=$("$package_dir/openvmm" --help)
          for flag in \
            --machine --microvm-sandbox-block --microvm-workload-identity \
            --microvm-lifecycle --single-process --hypervisor --memory \
            --kernel --initrd --cmdline --net --network-profile \
            --network-egress --network-ingress --network-egress-allow \
            --network-egress-deny --host-loopback --network-proxy \
            --host-loopback-forward --microvm-report --paused; do
            grep -q -- "$flag" <<<"$help"
          done
          bwrap_help=$(bwrap --help)
          grep -q -- '--block-fd' <<<"$bwrap_help"
          grep -q -- '--json-status-fd' <<<"$bwrap_help"
          grep -q -- '--seccomp' <<<"$bwrap_help"
          grep -Fq 'nvx_pids_max={self.pids_max + 1}' \
            "$source_dir/scripts/nvx_tools/sandbox.py"
          grep -Fq 'proxy.address != self.gateway_ipv4' \
            "$source_dir/openvmm/vm/devices/net/net_backend_resources/src/egress.rs"
          grep -Fq 'if deny.iter().any' \
            "$source_dir/openvmm/vm/devices/net/net_backend_resources/src/egress.rs"
          grep -Fq 'readline("openvmm> ")' \
            "$source_dir/openvmm/openvmm/openvmm_entry/src/repl.rs"
          grep -Fq 'position(|x| *x == 0x11)' \
            "$source_dir/openvmm/openvmm/openvmm_entry/src/repl.rs"

      - name: Capture host preflight and privileged-resource evidence
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/nvx-phase-3f-evidence
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$EVIDENCE_DIR"
          evidence="$EVIDENCE_DIR/evidence.jsonl"
          : > "$evidence"
          chmod 0600 "$evidence"

          record() {
            jq -cn \
              --arg check "$1" \
              --arg status "$2" \
              --argjson evidence "$3" \
              '{check:$check,status:$status,evidence:$evidence}' >> "$evidence"
          }

          cleanup_errors=()
          account_name="awfnvx-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cgroup_memory_max=536870912
          cgroup_cpu_max='200000 100000'
          cgroup_pids_max=128
          cgroup_parent="/sys/fs/cgroup/awf-nvx-ci-parent"
          cgroup_path="$cgroup_parent/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          netns_name="awfnvx-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          nft_table="awf_nvx_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            set +e
            # Resolve the uid before the account is deleted so device ACLs are
            # always removed by their exact numeric identity.
            if [ -z "${uid:-}" ]; then
              uid=$(id -u "$account_name" 2>/dev/null)
            fi
            # Every privileged resource is removed and then verified absent;
            # a residue entry is recorded for each resource that survives.
            if sudo ip netns list | grep -qw "$netns_name"; then
              sudo ip netns exec "$netns_name" nft delete table inet "$nft_table" >/dev/null 2>&1
              if sudo ip netns exec "$netns_name" nft list table inet "$nft_table" >/dev/null 2>&1; then
                cleanup_errors+=("nft-table:$nft_table")
              fi
              sudo ip netns delete "$netns_name" >/dev/null 2>&1
            fi
            if sudo ip netns list | grep -qw "$netns_name"; then
              cleanup_errors+=("netns:$netns_name")
            fi
            if [ -d "$cgroup_path" ]; then
              sudo rmdir "$cgroup_path" >/dev/null 2>&1
            fi
            if [ -d "$cgroup_path" ]; then
              cleanup_errors+=("cgroup:$cgroup_path")
            fi
            if [ -d "$cgroup_parent" ]; then
              sudo rmdir "$cgroup_parent" >/dev/null 2>&1
            fi
            if [ -d "$cgroup_parent" ]; then
              cleanup_errors+=("cgroup-parent:$cgroup_parent")
            fi
            for device in /dev/kvm; do
              if [ -n "${uid:-}" ]; then
                sudo setfacl -x "u:$uid" "$device" >/dev/null 2>&1
                if sudo getfacl --absolute-names --numeric "$device" 2>/dev/null \
                  | grep -q "^user:$uid:"; then
                  cleanup_errors+=("device-acl:$device")
                fi
              fi
            done
            if id -u "$account_name" >/dev/null 2>&1; then
              sudo userdel "$account_name" >/dev/null 2>&1
            fi
            if id -u "$account_name" >/dev/null 2>&1; then
              cleanup_errors+=("account:$account_name")
            fi
            if getent group "$account_name" >/dev/null 2>&1; then
              sudo groupdel "$account_name" >/dev/null 2>&1
            fi
            if getent group "$account_name" >/dev/null 2>&1; then
              cleanup_errors+=("group:$account_name")
            fi
            if [ "${#cleanup_errors[@]}" -eq 0 ]; then
              record cleanup PASS '{"residue":[]}'
              return 0
            else
              cleanup_json=$(printf '%s\n' "${cleanup_errors[@]}" | jq -R . | jq -cs '{residue:.}')
              record cleanup FAIL "$cleanup_json"
              return 1
            fi
          }
          trap 'status=$?; cleanup || status=1; exit "$status"' EXIT

          if [ "$(uname -s)" != Linux ] || [ "$(uname -m)" != x86_64 ]; then
            record host-preflight FAIL '{"reason":"NVX requires Linux x86_64"}'
            exit 1
          fi
          for device in /dev/kvm; do
            if [ ! -e "$device" ]; then
              record host-preflight FAIL "$(jq -cn --arg device "$device" '{missing:$device}')"
              exit 1
            fi
          done
          controllers=$(cat /sys/fs/cgroup/cgroup.controllers)
          for controller in cpu memory pids; do
            if ! grep -qw "$controller" <<<"$controllers"; then
              record host-preflight FAIL "$(jq -cn --arg controller "$controller" '{missingController:$controller}')"
              exit 1
            fi
          done
          record host-preflight PASS "$(jq -cn \
            --arg platform "$(uname -s)" \
            --arg arch "$(uname -m)" \
            --arg controllers "$controllers" \
            '{platform:$platform,architecture:$arch,cgroupControllers:$controllers}')"

          sudo useradd \
            --system \
            --user-group \
            --no-create-home \
            --home-dir /nonexistent \
            --shell /usr/sbin/nologin \
            --comment "AWF NVX CI ${GITHUB_RUN_ID}" \
            "$account_name"
          uid=$(id -u "$account_name")
          gid=$(id -g "$account_name")
          groups=$(id -G "$account_name")
          passwd_entry=$(getent passwd "$account_name")
          if [ "$groups" != "$gid" ]; then
            record account-isolation FAIL "$(jq -cn --arg groups "$groups" '{groups:$groups}')"
            exit 1
          fi
          record account-isolation PASS "$(jq -cn \
            --arg name "$account_name" \
            --arg uid "$uid" \
            --arg gid "$gid" \
            --arg passwd "$passwd_entry" \
            '{name:$name,uid:($uid|tonumber),gid:($gid|tonumber),passwd:$passwd,supplementaryGroups:[]}' )"

          for device in /dev/kvm; do
            before=$(stat -Lc '{"device":"%d","inode":"%i","mode":"%a"}' "$device")
            sudo setfacl -m "u:$uid:rw" "$device"
            acl_line=$(getfacl --absolute-names --numeric "$device" | grep "^user:$uid:rw-" || true)
            after=$(stat -Lc '{"device":"%d","inode":"%i","mode":"%a"}' "$device")
            if [ -z "$acl_line" ] || [ "$before" != "$after" ]; then
              record device-acl FAIL "$(jq -cn \
                --arg device "$device" \
                --arg acl "$acl_line" \
                --argjson before "$before" \
                --argjson after "$after" \
                '{device:$device,acl:$acl,before:$before,after:$after}')"
              exit 1
            fi
            record device-acl PASS "$(jq -cn \
              --arg device "$device" \
              --arg uid "$uid" \
              --arg acl "$acl_line" \
              --argjson identity "$after" \
              '{device:$device,uid:($uid|tonumber),acl:$acl,identity:$identity}')"
          done

          sudo mkdir -p "$cgroup_parent"
          sudo sh -c 'printf "+cpu +memory +pids" > /sys/fs/cgroup/cgroup.subtree_control' || true
          sudo sh -c "printf '+cpu +memory +pids' > '$cgroup_parent/cgroup.subtree_control'" || true
          sudo mkdir "$cgroup_path"
          sudo sh -c "printf '%s' '$cgroup_memory_max' > '$cgroup_path/memory.max'"
          sudo sh -c "printf '%s' '$cgroup_cpu_max' > '$cgroup_path/cpu.max'"
          sudo sh -c "printf '%s' '$cgroup_pids_max' > '$cgroup_path/pids.max'"
          if [ "$(cat "$cgroup_path/memory.max")" != "$cgroup_memory_max" ] ||
             [ "$(cat "$cgroup_path/cpu.max")" != "$cgroup_cpu_max" ] ||
             [ "$(cat "$cgroup_path/pids.max")" != "$cgroup_pids_max" ]; then
            record cgroup-limits FAIL "$(jq -cn \
              --arg memory "$(cat "$cgroup_path/memory.max")" \
              --arg cpu "$(cat "$cgroup_path/cpu.max")" \
              --arg pids "$(cat "$cgroup_path/pids.max")" \
              '{memoryMax:$memory,cpuMax:$cpu,pidsMax:$pids}')"
            exit 1
          fi
          record cgroup-limits PASS "$(jq -cn \
            --arg path "$cgroup_path" \
            --arg memory "$(cat "$cgroup_path/memory.max")" \
            --arg cpu "$(cat "$cgroup_path/cpu.max")" \
            --arg pids "$(cat "$cgroup_path/pids.max")" \
            '{path:$path,memoryMax:$memory,cpuMax:$cpu,pidsMax:$pids}')"

          sudo ip netns add "$netns_name"
          sudo ip netns exec "$netns_name" nft add table inet "$nft_table"
          sudo ip netns exec "$netns_name" nft \
            "add chain inet $nft_table input { type filter hook input priority filter ; policy drop ; }"
          sudo ip netns exec "$netns_name" nft \
            "add chain inet $nft_table output { type filter hook output priority filter ; policy drop ; }"
          sudo ip netns exec "$netns_name" nft \
            "add rule inet $nft_table output ip daddr 172.30.0.10 tcp dport 3128 counter accept"
          sudo ip netns exec "$netns_name" nft \
            "add rule inet $nft_table output udp dport 53 counter drop"
          ruleset=$(sudo ip netns exec "$netns_name" nft list table inet "$nft_table")
          if ! grep -q 'policy drop' <<<"$ruleset" ||
             ! grep -q '172.30.0.10' <<<"$ruleset" ||
             ! grep -q 'udp dport 53' <<<"$ruleset"; then
            record network-policy FAIL "$(jq -cn --arg ruleset "$ruleset" '{ruleset:$ruleset}')"
            exit 1
          fi
          record network-policy PASS "$(jq -cn \
            --arg namespace "$netns_name" \
            --arg ruleset "$ruleset" \
            '{namespace:$namespace,denyByDefault:($ruleset|contains("policy drop")),squidAllowed:($ruleset|contains("172.30.0.10")),dnsDenied:($ruleset|contains("udp dport 53")),ruleset:$ruleset}')"
          record direct-launch-contract PASS \
            '{"openvmm":"pinned flags verified","bubblewrap":"block/status fd flags verified","tapRequired":false}'

      - name: Start credential-holding AWF proxy topology
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWF_SQUID_IMAGE: ghcr.io/github/gh-aw-firewall/squid@sha256:cba5f56857e4869c4a00c1cce29c3056516cf1a746e18ce380753ecfbe40f112
          AWF_API_PROXY_IMAGE: ghcr.io/github/gh-aw-firewall/api-proxy@sha256:30ab6d3261dd95364281fa0b52ab78450e1c01aa074eccc3a8d4f04b12a6560b
        run: |
          set -euo pipefail
          bridge=awfnvxbr0
          cleanup() {
            sudo docker rm -f nvx-phase3f-squid nvx-phase3f-api-proxy \
              >/dev/null 2>&1 || true
            sudo docker network rm awf-net >/dev/null 2>&1 || true
          }
          trap cleanup ERR
          cleanup
          cat > "$RUNNER_TEMP/nvx-squid.conf" <<'EOF'
          http_port 0.0.0.0:3128
          acl all src all
          http_access allow all
          cache deny all
          access_log stdio:/dev/stdout
          cache_log /dev/stderr
          pid_filename none
          EOF
          sudo docker network create \
            --driver bridge \
            --subnet 172.30.0.0/24 \
            --opt "com.docker.network.bridge.name=$bridge" \
            awf-net
          sudo docker create \
            --name nvx-phase3f-squid \
            --network awf-net \
            --ip 172.30.0.10 \
            "$AWF_SQUID_IMAGE"
          sudo docker cp \
            "$RUNNER_TEMP/nvx-squid.conf" \
            nvx-phase3f-squid:/etc/squid/squid.conf
          sudo docker start nvx-phase3f-squid
          sudo --preserve-env=COPILOT_GITHUB_TOKEN docker run --detach \
            --name nvx-phase3f-api-proxy \
            --network awf-net \
            --ip 172.30.0.30 \
            --env HTTP_PROXY=http://172.30.0.10:3128 \
            --env HTTPS_PROXY=http://172.30.0.10:3128 \
            --env COPILOT_GITHUB_TOKEN \
            "$AWF_API_PROXY_IMAGE"
          for endpoint in 172.30.0.10:3128 172.30.0.30:10002; do
            host=${endpoint%:*}
            port=${endpoint#*:}
            ready=false
            for _ in $(seq 1 60); do
              if nc -z -w 1 "$host" "$port"; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              sudo docker logs nvx-phase3f-squid || true
              sudo docker logs nvx-phase3f-api-proxy || true
              echo "NVX infrastructure endpoint did not become ready: $endpoint" >&2
              exit 1
            fi
          done
          trap - ERR

      - name: Run attested end-to-end NvxManager evidence
        env:
          ALPINE_IMAGE: alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
          COPILOT_PACKAGE: '@github/copilot-linuxmusl-x64'
          COPILOT_VERSION: 1.0.86
          COPILOT_ARCHIVE: github-copilot-linuxmusl-x64-1.0.86.tgz
          COPILOT_ARCHIVE_SHA256: 34cf74e32c5227efd1957ff69f9ad957205968621c1ce4a84384ece6c19a2f6c
          SIGNER_WORKFLOW: github/gh-aw-firewall/.github/workflows/nvx-phase-3b-live-kvm.yml
          EVIDENCE_DIR: ${{ runner.temp }}/nvx-phase-3f-evidence
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/nvx-attested-artifacts"
          layer_root="$RUNNER_TEMP/nvx-alpine-root"
          package_dir="$RUNNER_TEMP/nvx-copilot-package"
          bridge=awfnvxbr0
          cleanup() {
            sudo docker rm -f nvx-phase3f-squid nvx-phase3f-api-proxy \
              >/dev/null 2>&1 || true
            sudo docker network rm awf-net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo chown -R root:root "$artifact_dir"
          sudo chmod 0555 "$artifact_dir/openvmm"
          sudo chmod 0444 \
            "$artifact_dir/vmlinux" \
            "$artifact_dir/initramfs.cpio.gz" \
            "$artifact_dir/manifest.json" \
            "$artifact_dir/manifest.sigstore.jsonl"
          mkdir -p "$layer_root"
          sudo docker pull "$ALPINE_IMAGE"
          container=$(sudo docker create "$ALPINE_IMAGE")
          trap 'sudo docker rm -f "$container" >/dev/null 2>&1 || true; cleanup' EXIT
          sudo docker export "$container" | tar -xf - -C "$layer_root"
          sudo docker rm "$container"
          container=
          mkdir -p \
            "$layer_root/etc" \
            "$layer_root/home/nobody/.ssh" \
            "$layer_root/usr/local/bin" \
            "$package_dir"
          printf 'nobody:x:65534:65534:nobody:/home/nobody:/sbin/nologin\n' \
            > "$layer_root/etc/passwd"
          printf 'nogroup:x:65534:\n' > "$layer_root/etc/group"
          printf 'present\n' > "$layer_root/etc/nvx-layer-marker"
          printf 'must-not-enter-guest\n' \
            > "$layer_root/home/nobody/.ssh/id_rsa"
          chmod 1777 "$layer_root/tmp"

          npm pack "${COPILOT_PACKAGE}@${COPILOT_VERSION}" \
            --pack-destination "$RUNNER_TEMP" \
            --silent
          printf '%s  %s\n' \
            "$COPILOT_ARCHIVE_SHA256" \
            "$RUNNER_TEMP/$COPILOT_ARCHIVE" |
            sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$COPILOT_ARCHIVE" \
            --strip-components=1 \
            -C "$package_dir"
          install -m 0755 \
            "$package_dir/copilot" \
            "$layer_root/usr/local/bin/copilot"

          cat > "$layer_root/usr/local/bin/nvx-filesystem-proof" <<'EOF'
          #!/bin/sh
          set -eu
          test -r /etc/nvx-layer-marker
          test ! -e /home/nobody/.ssh/id_rsa
          test ! -e /root/.ssh/id_rsa
          test ! -e /run/secrets
          test ! -e /host
          printf 'private-scratch\n' > /tmp/nvx-scratch-proof
          test "$(cat /tmp/nvx-scratch-proof)" = private-scratch
          echo NVX-FILESYSTEM-DENIAL-PROOF
          EOF

          cat > "$layer_root/usr/local/bin/nvx-network-proof" <<'EOF'
          #!/bin/sh
          set -eu
          nc -z -w 5 172.30.0.10 3128
          nc -z -w 5 172.30.0.30 10002
          if nc -z -w 3 1.1.1.1 443; then
            echo "unexpected direct internet egress" >&2
            exit 1
          fi
          if nc -z -w 3 169.254.169.254 80; then
            echo "unexpected metadata egress" >&2
            exit 1
          fi
          echo NVX-NETWORK-DENIAL-PROOF
          EOF

          cat > "$layer_root/usr/local/bin/run-copilot-proof" <<'EOF'
          #!/bin/sh
          set -eu
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${COPILOT_GITHUB_TOKEN:-}"
          if env | grep -Eq \
            '^(GH_TOKEN|GITHUB_TOKEN|COPILOT_GITHUB_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY)='; then
            echo "credential variable reached the NVX guest" >&2
            exit 1
          fi
          test ! -e /run/secrets
          test ! -e /home/nobody/.config/gh/hosts.yml
          test ! -e /home/nobody/.config/github-copilot
          test ! -e /home/nobody/.copilot
          runtime_home=/tmp/copilot-home
          mkdir -m 0700 "$runtime_home"
          export HOME="$runtime_home"
          export XDG_CACHE_HOME="$runtime_home/.cache"
          export XDG_CONFIG_HOME="$runtime_home/.config"
          export XDG_STATE_HOME="$runtime_home/.local/state"
          placeholder=ghu_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export COPILOT_TOKEN="$placeholder"
          export COPILOT_GITHUB_TOKEN="$placeholder"
          export COPILOT_PROVIDER_API_KEY="$placeholder"
          export COPILOT_OFFLINE=true
          export COPILOT_API_URL=http://172.30.0.30:10002
          export COPILOT_PROVIDER_BASE_URL=http://172.30.0.30:10002
          exec /usr/local/bin/copilot \
            --prompt "Respond with exactly NVX-COPILOT-PROOF and nothing else." \
            --silent \
            --no-color \
            --stream on \
            --allow-all-tools \
            --disable-builtin-mcps \
            --no-custom-instructions \
            --no-auto-update \
            --no-ask-user \
            --model claude-sonnet-5 \
            --max-ai-credits 30
          EOF
          chmod 0755 \
            "$layer_root/usr/local/bin/nvx-filesystem-proof" \
            "$layer_root/usr/local/bin/nvx-network-proof" \
            "$layer_root/usr/local/bin/run-copilot-proof"
          sudo chown -R 65534:65534 "$layer_root/home/nobody"

          evidence_runner="$RUNNER_TEMP/nvx-manager-live-evidence.cjs"
          ./node_modules/.bin/esbuild \
            scripts/ci/nvx-manager-live-evidence.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --target=node22 \
            --outfile="$evidence_runner"
          sudo node "$evidence_runner" \
            --artifacts "$artifact_dir" \
            --layer "$layer_root" \
            --bridge "$bridge" \
            --signerWorkflow "$SIGNER_WORKFLOW" \
            --evidence "$EVIDENCE_DIR"

      - name: Run focused NVX Phase 3d tests
        run: |
          npm test -- --runTestsByPath \
            src/nvx/cleanup-record.test.ts \
            src/nvx/artifact-manifest.test.ts \
            src/nvx/preflight.test.ts \
            src/nvx/runtime-lifecycle.test.ts \
            src/nvx/confinement.test.ts \
            src/nvx/launch-executor.test.ts \
            src/nvx/manager.test.ts \
            src/nvx/one-shot-adapter.test.ts \
            src/microvm/network.test.ts \
            src/container-runtime.test.ts

      - name: Build and type-check
        run: |
          npm run build
          npm run type-check

      - name: Prepare bounded diagnostics
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/nvx-phase-3f-evidence
        run: |
          if sudo test -d "$EVIDENCE_DIR"; then
            sudo chown -R "$(id -u):$(id -g)" "$EVIDENCE_DIR"
          fi

      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nvx-phase-3f-evidence
          path: ${{ runner.temp }}/nvx-phase-3f-evidence/
          if-no-files-found: warn
          retention-days: 7
