name: Publish model catalogue

on:
  push:
    branches: [main]
    paths:
      - 'shared/model-information/**'
      - 'scripts/model-information/**'
      - 'containers/api-proxy/models.dev.catalog.json'
      - 'containers/api-proxy/model-information.*.generated.json'
      - 'containers/api-proxy/ai-credits-pricing-reference.json'
      - 'containers/api-proxy/model-api-mapping.json'
      - 'src/model-information.compat.generated.json'
      - 'docs/model-api-mapping.json'
      - '.github/workflows/publish-model-catalogue.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'

permissions:
  contents: read

concurrency:
  group: model-catalogue-publication-v1
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'github/gh-aw-firewall' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.snapshot.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate canonical sources and every generated projection offline
        id: snapshot
        run: node scripts/model-information/build-publication.cjs "$RUNNER_TEMP/snapshot.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-catalogue-v1
          path: ${{ runner.temp }}/snapshot.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'github/gh-aw-firewall' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-catalogue-v1
          path: ${{ runner.temp }}/model-catalogue
      - name: Atomically publish immutable snapshot and current pointer
        env:
          SNAPSHOT_SHA256: ${{ needs.build.outputs.sha256 }}
        run: node scripts/model-information/publish.cjs "$RUNNER_TEMP/model-catalogue/snapshot.json"
