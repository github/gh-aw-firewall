name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false  # Never cancel an in-progress release

permissions:
  contents: write   # Required for creating releases, pushing version commits and tags
  packages: write   # Required for pushing to GHCR
  id-token: write   # Required for cosign keyless signing
  attestations: write # Required for release and Cloud Hypervisor artifact provenance

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      version_number: ${{ steps.bump.outputs.version_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify branch
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/v')
        run: |
          echo "::error::Release should be triggered on main or a maintenance branch (v*.x), got: ${{ github.ref }}"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Derive current version from git tags (authoritative source),
          # not package.json which may be stale on main since we can't
          # push version-bump commits to protected branches.
          LATEST_TAG=$(git tag --sort=-version:refname | grep '^v[0-9]' | head -n1 || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          echo "Latest version from git tags: $LATEST_VERSION"

          # Sync package.json to latest tag version before bumping
          npm version "$LATEST_VERSION" --no-git-tag-version --allow-same-version

          # Bump to next version
          npm version ${{ inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")

          # Check if this tag already exists (idempotent retry support)
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, reusing it"
            echo "version=v$VERSION" >> $GITHUB_OUTPUT
            echo "version_number=$VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          node -e 'require("fs").writeFileSync("src/cloud-hypervisor/artifact-compatibility.json", JSON.stringify({releaseTag: process.argv[1]}, null, 2) + "\n")' "v$VERSION"

          # Create a commit with the bumped version and tag it.
          # Only push the tag — branch protection prevents pushing to main.
          # Downstream jobs checkout by tag, so they get the correct package.json.
          git add package.json package-lock.json src/cloud-hypervisor/artifact-compatibility.json
          git commit -m "$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"

          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to v$VERSION (${{ inputs.bump }})"

  build-squid-platform:
    name: Build Squid Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Squid image
        id: build_squid
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./containers/squid
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/squid,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=squid-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=squid-${{ matrix.arch }}

      - name: Export Squid image digest
        env:
          DIGEST: ${{ steps.build_squid.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid Squid image digest for $ARCH"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/squid-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/squid-digests/$ARCH"

      - name: Upload Squid image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: squid-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/squid-digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  build-squid:
    name: Publish Squid Image
    runs-on: ubuntu-24.04
    needs: [bump-version, build-squid-platform]
    outputs:
      digest: ${{ steps.build_squid.outputs.digest }}
    steps:
      - name: Download Squid image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: squid-digest-*
          path: ${{ runner.temp }}/squid-digests
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish Squid multi-architecture manifest
        id: build_squid
        env:
          IMAGE: ghcr.io/${{ github.repository }}/squid
          VERSION: ${{ needs.bump-version.outputs.version_number }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            file="$RUNNER_TEMP/squid-digests/$arch"
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing Squid image digest for $arch"
              exit 1
            fi
            digest=$(cat "$file")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid Squid image digest for $arch"
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid Squid multi-architecture manifest digest"
            exit 1
          fi
          docker buildx imagetools inspect "$IMAGE@$digest" --raw \
            | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") and index("linux/arm64")' > /dev/null \
            || { echo "::error::Squid image must include linux/amd64 and linux/arm64"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign Squid image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/squid@${{ steps.build_squid.outputs.digest }}

      - name: Generate SBOM for Squid image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}/squid@${{ steps.build_squid.outputs.digest }}
          format: spdx-json
          output-file: squid-sbom.spdx.json

      - name: Attest SBOM for Squid image
        run: |
          cosign attest --yes \
            --predicate squid-sbom.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}/squid@${{ steps.build_squid.outputs.digest }}

  build-agent-platform:
    name: Build Agent Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}

      - name: Build and push Agent image
        uses: ./.github/actions/build-release-image
        with:
          image: agent
          arch: ${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          context: ./containers/agent
          # Disable cache for agent image to ensure security-critical packages
          # (like libcap2-bin for capability dropping) are always freshly installed
          no-cache: 'true'
          cache: 'false'
          verify-seccomp: 'true'

  build-agent:
    name: Publish Agent Image
    runs-on: ubuntu-24.04
    needs: [bump-version, build-agent-platform]
    outputs:
      digest: ${{ steps.build_agent.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}
      - name: Publish Agent image
        id: build_agent
        uses: ./.github/actions/publish-release-image
        with:
          image: agent
          version: ${{ needs.bump-version.outputs.version_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Agent image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/agent@${{ steps.build_agent.outputs.digest }}

      - name: Generate SBOM for Agent image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}/agent@${{ steps.build_agent.outputs.digest }}
          format: spdx-json
          output-file: agent-sbom.spdx.json

      - name: Attest SBOM for Agent image
        run: |
          cosign attest --yes \
            --predicate agent-sbom.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}/agent@${{ steps.build_agent.outputs.digest }}

  build-api-proxy-platform:
    name: Build API Proxy Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}

      - name: Build and push API Proxy image
        uses: ./.github/actions/build-release-image
        with:
          image: api-proxy
          arch: ${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          context: ./containers/api-proxy
          pull: 'true'
          build-args: |
            AWF_VERSION=${{ needs.bump-version.outputs.version_number }}

  build-api-proxy:
    name: Publish API Proxy Image
    runs-on: ubuntu-24.04
    needs: [bump-version, build-api-proxy-platform]
    outputs:
      digest: ${{ steps.build_api_proxy.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}
      - name: Publish API Proxy image
        id: build_api_proxy
        uses: ./.github/actions/publish-release-image
        with:
          image: api-proxy
          version: ${{ needs.bump-version.outputs.version_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign API Proxy image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/api-proxy@${{ steps.build_api_proxy.outputs.digest }}

      - name: Generate SBOM for API Proxy image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}/api-proxy@${{ steps.build_api_proxy.outputs.digest }}
          format: spdx-json
          output-file: api-proxy-sbom.spdx.json

      - name: Attest SBOM for API Proxy image
        run: |
          cosign attest --yes \
            --predicate api-proxy-sbom.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}/api-proxy@${{ steps.build_api_proxy.outputs.digest }}

  build-router-platform:
    name: Build Router Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}

      # The image version label is the router's own version (the Dockerfile's
      # ARG VERSION default, which the build checks against main.go), not the
      # AWF version, so VERSION is deliberately not passed.
      # VCS_REF is the checked-out tag commit, not github.sha: bump-version
      # creates a tag-only version commit on top of the dispatched commit.
      - name: Compute router build arguments
        id: router_args
        run: |
          set -euo pipefail
          echo "vcs_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "openapi_sha256=$(sha256sum containers/router/openapi.yaml | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Build and push Router image
        uses: ./.github/actions/build-release-image
        with:
          image: router
          arch: ${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          context: ./containers/router
          pull: 'true'
          build-args: |
            VCS_REF=${{ steps.router_args.outputs.vcs_ref }}
            OPENAPI_SHA256=${{ steps.router_args.outputs.openapi_sha256 }}

  build-router:
    name: Publish Router Image
    runs-on: ubuntu-24.04
    needs: [bump-version, build-router-platform]
    outputs:
      digest: ${{ steps.build_router.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}
      - name: Compute router build arguments
        id: router_args
        run: |
          set -euo pipefail
          echo "vcs_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "openapi_sha256=$(sha256sum containers/router/openapi.yaml | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Publish Router image
        id: build_router
        uses: ./.github/actions/publish-release-image
        with:
          image: router
          version: ${{ needs.bump-version.outputs.version_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify Router image labels and platforms
        env:
          REFERENCE: ghcr.io/${{ github.repository }}/router@${{ steps.build_router.outputs.digest }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          EXPECTED_REVISION: ${{ steps.router_args.outputs.vcs_ref }}
          EXPECTED_OPENAPI_SHA256: ${{ steps.router_args.outputs.openapi_sha256 }}
        run: |
          set -euo pipefail
          docker pull --quiet "$REFERENCE"
          labels=$(docker image inspect "$REFERENCE" --format '{{json .Config.Labels}}')
          require() {
            value=$(jq -r --arg key "$1" '.[$key] // ""' <<<"$labels")
            if [[ "$value" != "$2" ]]; then
              echo "::error::Router label $1 is '$value', expected '$2'"
              exit 1
            fi
          }
          require org.opencontainers.image.source "$EXPECTED_SOURCE"
          require org.opencontainers.image.revision "$EXPECTED_REVISION"
          require io.github.gh-aw-router.openapi-sha256 "$EXPECTED_OPENAPI_SHA256"
          version=$(jq -r '.["org.opencontainers.image.version"] // ""' <<<"$labels")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Router version label is '$version', expected a semantic version"
            exit 1
          fi
          docker buildx imagetools inspect "$REFERENCE" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") and index("linux/arm64")' > /dev/null \
            || { echo "::error::Router image must include linux/amd64 and linux/arm64"; exit 1; }
          echo "Router ${version} at ${REFERENCE}"

      - name: Sign Router image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/router@${{ steps.build_router.outputs.digest }}

      - name: Generate SBOM for Router image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}/router@${{ steps.build_router.outputs.digest }}
          format: spdx-json
          output-file: router-sbom.spdx.json

      - name: Attest SBOM for Router image
        run: |
          cosign attest --yes \
            --predicate router-sbom.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}/router@${{ steps.build_router.outputs.digest }}

  build-cli-proxy-platform:
    name: Build CLI Proxy Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}

      - name: Build and push CLI Proxy image
        uses: ./.github/actions/build-release-image
        with:
          image: cli-proxy
          arch: ${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          context: ./containers/cli-proxy

  build-cli-proxy:
    name: Publish CLI Proxy Image
    runs-on: ubuntu-24.04
    needs: [bump-version, build-cli-proxy-platform]
    outputs:
      digest: ${{ steps.build_cli_proxy.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}
      - name: Publish CLI Proxy image
        id: build_cli_proxy
        uses: ./.github/actions/publish-release-image
        with:
          image: cli-proxy
          version: ${{ needs.bump-version.outputs.version_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign CLI Proxy image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/cli-proxy@${{ steps.build_cli_proxy.outputs.digest }}

      - name: Generate SBOM for CLI Proxy image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}/cli-proxy@${{ steps.build_cli_proxy.outputs.digest }}
          format: spdx-json
          output-file: cli-proxy-sbom.spdx.json

      - name: Attest SBOM for CLI Proxy image
        run: |
          cosign attest --yes \
            --predicate cli-proxy-sbom.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}/cli-proxy@${{ steps.build_cli_proxy.outputs.digest }}

  # Build the unified enclave images from containers/enclave/Dockerfile.
  build-enclave-script-platform:
    name: Build Enclave Script Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}

      - name: Build and push Enclave Script image
        uses: ./.github/actions/build-release-image
        with:
          image: enclave-script
          arch: ${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          context: ./containers
          file: ./containers/enclave/Dockerfile
          target: enclave-script

  build-enclave-script:
    name: Publish Enclave Script Image
    runs-on: ubuntu-24.04
    needs: [bump-version, build-enclave-script-platform]
    outputs:
      digest: ${{ steps.build_enclave_script.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}
      - name: Publish Enclave Script image
        id: build_enclave_script
        uses: ./.github/actions/publish-release-image
        with:
          image: enclave-script
          version: ${{ needs.bump-version.outputs.version_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign Enclave Script image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/enclave-script@${{ steps.build_enclave_script.outputs.digest }}

      - name: Generate SBOM for Enclave Script image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}/enclave-script@${{ steps.build_enclave_script.outputs.digest }}
          format: spdx-json
          output-file: enclave-script-sbom.spdx.json

      - name: Attest SBOM for Enclave Script image
        run: |
          cosign attest --yes \
            --predicate enclave-script-sbom.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}/enclave-script@${{ steps.build_enclave_script.outputs.digest }}

  build-enclave-agent-platform:
