      - name: Attest SBOM for Build-Tools image
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3..."
            if cosign attest --yes \
              --predicate build-tools-sbom.spdx.json \
