  build-release-package:
    name: Build Release Bundle and NPM Package
    runs-on: ubuntu-24.04
    needs: bump-version
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Create esbuild bundle
        run: |
          set -euo pipefail
          node scripts/build-bundle.mjs
          node release/awf-bundle.js --version
          node release/awf-bundle.js --help > "$RUNNER_TEMP/bundle-help.txt"
          test -s "$RUNNER_TEMP/bundle-help.txt"
      - name: Create tarball for npm package
        run: |
          npm pack
          mv ./*.tgz release/awf.tgz
      - name: Upload release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            release/awf-bundle.js
            release/awf.tgz
          if-no-files-found: error
          retention-days: 7

  build-release-binaries:
    name: Build Release Binary (${{ matrix.binary }})
    runs-on: ubuntu-24.04
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: node24-linux-x64
            binary: awf-linux-x64
          - target: node24-linux-arm64
            binary: awf-linux-arm64
          - target: node24-macos-x64
            binary: awf-darwin-x64
          - target: node24-macos-arm64
            binary: awf-darwin-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Create binary
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          mkdir -p release
          ./node_modules/.bin/pkg . --targets "$TARGET" --output "release/$BINARY"
          test -s "release/$BINARY"
          file "release/$BINARY"
      - name: Upload release binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-${{ matrix.binary }}
          path: release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [bump-version, build-squid, build-agent, build-api-proxy, build-router, build-cli-proxy, build-agent-act, build-build-tools, build-enclave-script, build-enclave-agent, build-enclave-mcp-server, build-gh-aw-node, build-cloud-hypervisor-guest-base, build-cloud-hypervisor-primary, build-cloud-hypervisor-enclave, build-cloud-hypervisor-test-artifacts, build-nvx-test-artifacts, build-release-package, build-release-binaries]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}  # Checkout the version tag
          fetch-depth: 0  # Full history for tag listing and changelog generation
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Download release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release

      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-binary-*
          path: release
          merge-multiple: true

      - name: Restore binary executable permissions
        run: chmod 0755 release/awf-linux-x64 release/awf-linux-arm64 release/awf-darwin-x64 release/awf-darwin-arm64

      - name: Smoke test binary (x64)
        run: |
          npx tsx scripts/ci/smoke-test-binary.ts \
            release/awf-linux-x64 \
            ${{ needs.bump-version.outputs.version_number }}

      - name: Verify arm64 binary is valid ELF
        run: |
          file release/awf-linux-arm64 | grep -q "ELF 64-bit LSB" || { echo "ERROR: arm64 binary is not a valid ELF"; exit 1; }
          file release/awf-linux-arm64 | grep -qi "aarch64\|arm" || { echo "ERROR: arm64 binary is not for ARM architecture"; exit 1; }
          echo "✓ arm64 binary is a valid ELF for ARM64"

      - name: Verify macOS binaries are valid Mach-O
        run: |
          file release/awf-darwin-x64 | grep -q "Mach-O 64-bit" || { echo "ERROR: macOS x64 binary is not a valid Mach-O"; exit 1; }
          file release/awf-darwin-x64 | grep -qi "x86_64" || { echo "ERROR: macOS x64 binary is not for x86_64 architecture"; exit 1; }
          echo "✓ macOS x64 binary is a valid Mach-O for x86_64"

          file release/awf-darwin-arm64 | grep -q "Mach-O 64-bit" || { echo "ERROR: macOS arm64 binary is not a valid Mach-O"; exit 1; }
          file release/awf-darwin-arm64 | grep -qi "arm64" || { echo "ERROR: macOS arm64 binary is not for ARM64 architecture"; exit 1; }
          echo "✓ macOS arm64 binary is a valid Mach-O for ARM64"

      - name: Download Cloud Hypervisor preview test artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-cloud-hypervisor-test-x86_64
          path: cloud-hypervisor-release-assets

      - name: Stage Cloud Hypervisor preview test assets
        run: |
          cp cloud-hypervisor-release-assets/awf-cloud-hypervisor-test-x86_64.tar.gz \
            release/cloud-hypervisor-test-x86_64.tar.gz
          cp cloud-hypervisor-release-assets/SHA256SUMS \
            release/cloud-hypervisor-test-x86_64.SHA256SUMS
          cp cloud-hypervisor-release-assets/manifest.json \
            release/cloud-hypervisor-test-x86_64.manifest.json
          cp cloud-hypervisor-release-assets/manifest.sigstore.jsonl \
            release/cloud-hypervisor-test-x86_64.manifest.sigstore.jsonl
          cp cloud-hypervisor-release-assets/sbom.spdx.json \
            release/cloud-hypervisor-test-x86_64.sbom.spdx.json
          cp cloud-hypervisor-release-assets/awf-cloud-hypervisor-enclave-rootfs-x86_64.tar.gz \
            release/cloud-hypervisor-enclave-rootfs-x86_64.tar.gz
          gzip -n -c cloud-hypervisor-release-assets/enclave-rootfs.ext4 \
            > release/enclave-rootfs.ext4.gz
          cp cloud-hypervisor-release-assets/enclave-rootfs.sbom.spdx.json \
            release/enclave-rootfs.sbom.spdx.json
          cp cloud-hypervisor-release-assets/rootfs.sbom.spdx.json \
            release/cloud-hypervisor-rootfs.sbom.spdx.json
          cp cloud-hypervisor-release-assets/enclave-rootfs.provenance.sigstore.jsonl \
            release/enclave-rootfs.provenance.sigstore.jsonl
          cp cloud-hypervisor-release-assets/enclave-manifest.json \
            release/cloud-hypervisor-enclave-rootfs-x86_64.manifest.json
          cp cloud-hypervisor-release-assets/enclave-manifest.sigstore.jsonl \
            release/cloud-hypervisor-enclave-rootfs-x86_64.manifest.sigstore.jsonl
          cp cloud-hypervisor-release-assets/setup-cloud-hypervisor-enclave-artifacts.sh \
            release/setup-cloud-hypervisor-enclave-artifacts.sh
          chmod 0755 release/setup-cloud-hypervisor-enclave-artifacts.sh

      - name: Download NVX preview test artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-nvx-test-x86_64
          path: nvx-release-assets

      - name: Stage NVX preview test assets
        run: |
          cp nvx-release-assets/nvx-test-x86_64.tar.gz \
            release/nvx-test-x86_64.tar.gz
          cp nvx-release-assets/nvx-test-x86_64/manifest.json \
            release/nvx-test-x86_64.manifest.json
          cp nvx-release-assets/nvx-test-x86_64/manifest.sigstore.jsonl \
            release/nvx-test-x86_64.manifest.sigstore.jsonl

      - name: Generate containers list
        run: |
          mkdir -p release
          printf '%s\n' \
            "ghcr.io/${{ github.repository }}/squid@${{ needs['build-squid'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/agent@${{ needs['build-agent'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/agent-act@${{ needs['build-agent-act'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/api-proxy@${{ needs['build-api-proxy'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/router@${{ needs['build-router'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/cli-proxy@${{ needs['build-cli-proxy'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/enclave-script@${{ needs['build-enclave-script'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/enclave-agent@${{ needs['build-enclave-agent'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/enclave-mcp-server@${{ needs['build-enclave-mcp-server'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/cloud-hypervisor-guest-base@${{ needs['build-cloud-hypervisor-guest-base'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/cloud-hypervisor-primary@${{ needs['build-cloud-hypervisor-primary'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/cloud-hypervisor-enclave@${{ needs['build-cloud-hypervisor-enclave'].outputs.digest }}" \
            "ghcr.io/${{ github.repository }}/gh-aw-node@${{ needs['build-gh-aw-node'].outputs.digest }}" \
            > release/containers.txt
          echo "Generated containers.txt:"
          cat release/containers.txt

      - name: Generate versioned JSON Schema
        run: |
          mkdir -p release
          # Generate all schemas with versioned $id URLs
          node scripts/generate-schema.mjs --version ${{ needs.bump-version.outputs.version }}
          # Copy generated files to release/ for upload
          cp docs/awf-config.schema.json release/awf-config.schema.json
          # Compatibility alias for consumers that previously pinned to awf-config.v1.schema.json
          cp docs/awf-config.schema.json release/awf-config.v1.schema.json
          cp schemas/audit.schema.json release/audit.schema.json
          cp schemas/token-usage.schema.json release/token-usage.schema.json
          echo "=== Schema preview (first 10 lines) ==="
          head -10 release/awf-config.schema.json

      - name: Package host enclave storage helper
        run: node scripts/build-enclave-storage-helper.mjs

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Bind release tag to checksums
        env:
          RELEASE_TAG: ${{ needs.bump-version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          printf '%s  refs/tags/%s\n' "$(sha256sum release/checksums.txt | cut -d ' ' -f1)" \
            "$RELEASE_TAG" > release/release-identity.txt

      - name: Attest AWF release payloads and metadata
        id: attest_awf_release
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/awf-linux-x64
            release/awf-linux-arm64
            release/awf-darwin-x64
            release/awf-darwin-arm64
            release/awf-bundle.js
            release/enclave-storage-helper.py
            release/awf.tgz
            release/checksums.txt
            release/containers.txt
            release/release-identity.txt

      - name: Bundle AWF release provenance for offline verification
        env:
          BUNDLE_PATH: ${{ steps.attest_awf_release.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" release/awf-release-provenance.sigstore.jsonl

      - name: Get previous release tag
        id: previous_tag
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ needs.bump-version.outputs.version }}"

          # Use git tags directly (more reliable than gh release list)
          # Get the most recent tag that is not the current tag
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n1 || echo "")

          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREVIOUS_TAG (current: $CURRENT_TAG)"

      - name: Generate changelog from commits
        id: changelog
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ needs.bump-version.outputs.version }}"
          PREVIOUS_TAG="${{ steps.previous_tag.outputs.previous_tag }}"

          echo "Generating changelog from $PREVIOUS_TAG to $CURRENT_TAG"

          # Generate changelog using GitHub's API
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$CURRENT_TAG" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              --jq '.body' 2>/dev/null || echo "")
          else
            # First release - try API without previous tag
            CHANGELOG=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$CURRENT_TAG" \
              --jq '.body' 2>/dev/null || echo "")
          fi

          # If API call failed, fall back to git log
          if [ -z "$CHANGELOG" ]; then
            echo "GitHub API failed, falling back to git log"
            if [ -n "$PREVIOUS_TAG" ]; then
              CHANGELOG=$(git log --oneline --pretty=format:"* %s (%h)" "$PREVIOUS_TAG..HEAD" 2>/dev/null || echo "* Initial release")
            else
              # First release - get all commits (no arbitrary limit)
              CHANGELOG=$(git log --oneline --pretty=format:"* %s (%h)" 2>/dev/null || echo "* Initial release")
            fi
          fi

          # Write changelog to file for multiline handling
          echo "$CHANGELOG" > changelog_body.md

          # Validate changelog was generated
          if [ ! -s changelog_body.md ]; then
            echo "Error: Changelog generation failed or produced empty output"
            exit 1
          fi

          echo "Changelog generated successfully ($(wc -l < changelog_body.md) lines)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CLI help output
        id: cli_help
        run: |
          set -euo pipefail

          # Generate CLI help from the built binary
          node dist/cli.js --help > cli_help.txt

          # Validate CLI help was generated
          if [ ! -s cli_help.txt ]; then
            echo "Error: CLI help generation failed or produced empty output"
            exit 1
          fi

          echo "CLI help generated ($(wc -l < cli_help.txt) lines):"
          cat cli_help.txt

      - name: Create Release Notes
        id: release_notes
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
          VERSION_NUMBER: ${{ needs.bump-version.outputs.version_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Use Node.js script for safe template substitution
          # (avoids shell injection issues with special characters)
          node scripts/generate-release-notes.js \
            changelog_body.md \
            cli_help.txt \
            release_notes.md

          # Validate output was generated
          if [ ! -s release_notes.md ]; then
            echo "Error: Release notes generation failed"
            exit 1
          fi

          # Cleanup temp files
          rm -f changelog_body.md cli_help.txt

          echo "Release notes preview (first 20 lines):"
          head -20 release_notes.md

      - name: Validate release asset sizes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const limit = 2147483648;
          for (const name of fs.readdirSync('release')) {
            const size = fs.statSync(`release/${name}`).size;
            if (size >= limit) {
              throw new Error(`Release asset ${name} is ${size} bytes; size must be less than ${limit}`);
            }
          }
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.bump-version.outputs.version }}
          name: Release ${{ needs.bump-version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.bump-version.outputs.version, 'alpha') || contains(needs.bump-version.outputs.version, 'beta') || contains(needs.bump-version.outputs.version, 'rc') }}
          files: |
            release/awf-linux-x64
            release/awf-linux-arm64
            release/awf-darwin-x64
            release/awf-darwin-arm64
            release/awf-bundle.js
            release/enclave-storage-helper.py
            release/awf.tgz
            release/cloud-hypervisor-test-x86_64.tar.gz
            release/cloud-hypervisor-test-x86_64.SHA256SUMS
            release/cloud-hypervisor-test-x86_64.manifest.json
            release/cloud-hypervisor-test-x86_64.manifest.sigstore.jsonl
            release/cloud-hypervisor-test-x86_64.sbom.spdx.json
            release/cloud-hypervisor-enclave-rootfs-x86_64.tar.gz
            release/cloud-hypervisor-enclave-rootfs-x86_64.manifest.json
            release/cloud-hypervisor-enclave-rootfs-x86_64.manifest.sigstore.jsonl
            release/nvx-test-x86_64.tar.gz
            release/nvx-test-x86_64.manifest.json
            release/nvx-test-x86_64.manifest.sigstore.jsonl
            release/enclave-rootfs.ext4.gz
            release/enclave-rootfs.sbom.spdx.json
            release/cloud-hypervisor-rootfs.sbom.spdx.json
            release/enclave-rootfs.provenance.sigstore.jsonl
            release/setup-cloud-hypervisor-enclave-artifacts.sh
            release/containers.txt
            release/awf-config.schema.json
            release/awf-config.v1.schema.json
            release/audit.schema.json
            release/token-usage.schema.json
            release/awf-release-provenance.sigstore.jsonl
            release/checksums.txt
            release/release-identity.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (for debugging)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-artifacts
          path: release/
          retention-days: 7

  enclave-conformance:
    name: Dispatch full release enclave conformance (${{ needs.bump-version.outputs.version }})
    needs: [bump-version, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Dispatch exact published tag once
        env:
          GH_TOKEN: ${{ github.token }}
          AWF_RELEASE_TAG: ${{ needs.bump-version.outputs.version }}
        run: node scripts/ci/dispatch-release-enclave-conformance.js

  primary-agent-validation:
    name: Dispatch release primary-agent live KVM (${{ needs.bump-version.outputs.version }})
    needs: [bump-version, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Dispatch exact published tag once
        env:
          GH_TOKEN: ${{ github.token }}
          AWF_RELEASE_TAG: ${{ needs.bump-version.outputs.version }}
        run: node scripts/ci/dispatch-release-enclave-conformance.js --primary

  build-cloud-hypervisor-guest-base:
    name: Build Cloud Hypervisor Guest Base
    runs-on: ubuntu-latest
    needs: bump-version
    outputs:
      digest: ${{ steps.build_guest_base.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up guest supervisor Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: guest/microvm-supervisor/go.mod
      - name: Build shared guest supervisor
        run: |
          mkdir -p /tmp/awf-guest-supervisor
          VERSION="${{ needs.bump-version.outputs.version }}" \
            OUTPUT=/tmp/awf-guest-supervisor/awf-supervisor \
            ./guest/microvm-supervisor/build.sh
      - name: Build and push guest base
        id: build_guest_base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./containers
          file: ./containers/cloud-hypervisor/Dockerfile
          build-contexts: |
            supervisor=/tmp/awf-guest-supervisor
          target: guest-base
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/cloud-hypervisor-guest-base:${{ needs.bump-version.outputs.version_number }}
      - name: Sign guest base image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/cloud-hypervisor-guest-base@${{ steps.build_guest_base.outputs.digest }}
      - name: Generate SBOM for guest base image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}/cloud-hypervisor-guest-base@${{ steps.build_guest_base.outputs.digest }}
          format: spdx-json
          output-file: cloud-hypervisor-guest-base-sbom.spdx.json
      - name: Attest SBOM for guest base image
        run: |
          cosign attest --yes \
            --predicate cloud-hypervisor-guest-base-sbom.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}/cloud-hypervisor-guest-base@${{ steps.build_guest_base.outputs.digest }}

  build-cloud-hypervisor-primary:
    name: Build Cloud Hypervisor Primary Guest
    runs-on: ubuntu-latest
    needs: [bump-version, build-build-tools, build-cloud-hypervisor-guest-base]
    outputs:
      digest: ${{ steps.build_primary.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build and push primary guest
        id: build_primary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./containers
          file: ./containers/cloud-hypervisor/Dockerfile
          target: primary
          platforms: linux/amd64
          push: true
          build-args: |
            GUEST_BASE_IMAGE=ghcr.io/${{ github.repository }}/cloud-hypervisor-guest-base@${{ needs.build-cloud-hypervisor-guest-base.outputs.digest }}
            BUILD_TOOLS_IMAGE=ghcr.io/${{ github.repository }}/build-tools@${{ needs.build-build-tools.outputs.digest }}
          tags: ghcr.io/${{ github.repository }}/cloud-hypervisor-primary:${{ needs.bump-version.outputs.version_number }}
      - name: Sign primary guest image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/cloud-hypervisor-primary@${{ steps.build_primary.outputs.digest }}
      - name: Generate SBOM for primary guest image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}/cloud-hypervisor-primary@${{ steps.build_primary.outputs.digest }}
          format: spdx-json
          output-file: cloud-hypervisor-primary-sbom.spdx.json
      - name: Attest SBOM for primary guest image
        run: |
          cosign attest --yes \
            --predicate cloud-hypervisor-primary-sbom.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}/cloud-hypervisor-primary@${{ steps.build_primary.outputs.digest }}

  build-cloud-hypervisor-enclave:
    name: Build Cloud Hypervisor Enclave Guest
    runs-on: ubuntu-latest
    needs: [bump-version, build-enclave-agent, build-cloud-hypervisor-guest-base]
    outputs:
      digest: ${{ steps.build_enclave.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build and push shared enclave guest
        id: build_enclave
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./containers
          file: ./containers/cloud-hypervisor/Dockerfile
          target: enclave
          platforms: linux/amd64
          push: true
          build-args: |
            GUEST_BASE_IMAGE=ghcr.io/${{ github.repository }}/cloud-hypervisor-guest-base@${{ needs.build-cloud-hypervisor-guest-base.outputs.digest }}
            ENCLAVE_AGENT_IMAGE=ghcr.io/${{ github.repository }}/enclave-agent@${{ needs.build-enclave-agent.outputs.digest }}
          tags: ghcr.io/${{ github.repository }}/cloud-hypervisor-enclave:${{ needs.bump-version.outputs.version_number }}
      - name: Sign shared enclave guest image with cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/cloud-hypervisor-enclave@${{ steps.build_enclave.outputs.digest }}
      - name: Generate SBOM for shared enclave guest image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}/cloud-hypervisor-enclave@${{ steps.build_enclave.outputs.digest }}
          format: spdx-json
          output-file: cloud-hypervisor-enclave-sbom.spdx.json
      - name: Attest SBOM for shared enclave guest image
        run: |
          cosign attest --yes \
            --predicate cloud-hypervisor-enclave-sbom.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository }}/cloud-hypervisor-enclave@${{ steps.build_enclave.outputs.digest }}

  build-cloud-hypervisor-test-artifacts:
    name: Build Cloud Hypervisor Preview Test Artifacts
    runs-on: ubuntu-24.04
    needs: [bump-version, build-enclave-agent, build-cloud-hypervisor-guest-base, build-cloud-hypervisor-primary, build-cloud-hypervisor-enclave]
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}

      - name: Free unused hosted-runner disk space
        # Kernel, virtiofsd, three ext4 images and their bundles need room on the
        # hosted runner. Remove preinstalled SDKs this job never uses.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: guest/microvm-supervisor/go.mod

      - name: Install guest build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential ca-certificates cpio e2fsprogs \
            file flex libcap2-bin libcap-ng-dev libelf-dev libseccomp-dev \
            libssl-dev pkg-config rsync xz-utils
          # virtiofsd is built from pinned upstream source by
          # build-test-artifacts.sh with the rustup toolchain it pins.
          rustup --version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify pinned test artifacts
        run: |
          GUEST_BASE_IMAGE="ghcr.io/${{ github.repository }}/cloud-hypervisor-guest-base@${{ needs.build-cloud-hypervisor-guest-base.outputs.digest }}" \
            PRIMARY_IMAGE="ghcr.io/${{ github.repository }}/cloud-hypervisor-primary@${{ needs.build-cloud-hypervisor-primary.outputs.digest }}" \
            ENCLAVE_IMAGE="ghcr.io/${{ github.repository }}/cloud-hypervisor-enclave@${{ needs.build-cloud-hypervisor-enclave.outputs.digest }}" \
            ENCLAVE_AGENT_IMAGE="ghcr.io/${{ github.repository }}/enclave-agent@${{ needs.build-enclave-agent.outputs.digest }}" \
            VERSION="${{ needs.bump-version.outputs.version }}" \
            AWF_CH_PRUNE_DOCKER_BUILD_CACHE=1 \
            ./guest/cloud-hypervisor/build-test-artifacts.sh
          ./guest/cloud-hypervisor/verify-test-artifacts.sh \
            release/cloud-hypervisor-test-x86_64

      - name: Attest guest artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/cloud-hypervisor-test-x86_64/awf-cloud-hypervisor-test-x86_64.tar.gz

      - name: Attest enclave rootfs bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/cloud-hypervisor-test-x86_64/awf-cloud-hypervisor-enclave-rootfs-x86_64.tar.gz

      - name: Attest shared enclave rootfs provenance
        id: attest_cloud_hypervisor_enclave_rootfs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/cloud-hypervisor-test-x86_64/enclave-rootfs.ext4

      - name: Attest release-pinned guest artifact manifest
        id: attest_cloud_hypervisor_manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/cloud-hypervisor-test-x86_64/manifest.json

      - name: Bundle manifest attestation for offline verification
        env:
          BUNDLE_PATH: ${{ steps.attest_cloud_hypervisor_manifest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" \
            release/cloud-hypervisor-test-x86_64/manifest.sigstore.jsonl

      - name: Attest release-pinned enclave artifact manifest
        id: attest_cloud_hypervisor_enclave_manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/cloud-hypervisor-test-x86_64/enclave-manifest.json

      - name: Bundle enclave provenance for offline verification
        env:
          ROOTFS_BUNDLE: ${{ steps.attest_cloud_hypervisor_enclave_rootfs.outputs.bundle-path }}
          MANIFEST_BUNDLE: ${{ steps.attest_cloud_hypervisor_enclave_manifest.outputs.bundle-path }}
        run: |
          cp "$ROOTFS_BUNDLE" \
            release/cloud-hypervisor-test-x86_64/enclave-rootfs.provenance.sigstore.jsonl
          cp "$MANIFEST_BUNDLE" \
            release/cloud-hypervisor-test-x86_64/enclave-manifest.sigstore.jsonl

      - name: Upload Cloud Hypervisor test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cloud-hypervisor-test-x86_64
          path: release/cloud-hypervisor-test-x86_64/
          if-no-files-found: error
          retention-days: 7

  build-nvx-test-artifacts:
    name: Build NVX Preview Test Artifacts
    runs-on: ubuntu-24.04
    needs: bump-version
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.bump-version.outputs.version }}

      - name: Fetch and verify pinned NVX release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVX_RELEASE: v0.1.0-dev.8fb0f1d64f2f
          NVX_ARCHIVE: nvx-0.1.0-linux-kvm.tar.gz
          NVX_ARCHIVE_SHA256: 0a4bb74e76e80a524c3dccd9336b77705ef91d6a908d6979403c59151a5883da
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/nvx-package"
          artifact_dir="release/nvx-test-x86_64"
          mkdir -p "$package_dir" "$artifact_dir"
          gh release download "$NVX_RELEASE" \
            --repo microsoft/nvx \
            --pattern "$NVX_ARCHIVE" \
            --dir "$package_dir"
          printf '%s  %s\n' \
            "$NVX_ARCHIVE_SHA256" \
            "$package_dir/$NVX_ARCHIVE" |
            sha256sum --check --status
          tar -xzf "$package_dir/$NVX_ARCHIVE" -C "$package_dir"
          extracted="$package_dir/nvx-0.1.0-linux-kvm"
          (
            cd "$extracted"
            sha256sum --check SHA256SUMS
          )
          install -m 0555 "$extracted/bin/openvmm" "$artifact_dir/openvmm"
          install -m 0444 "$extracted/guest/vmlinux" "$artifact_dir/vmlinux"
          install -m 0444 \
            "$extracted/guest/initramfs.cpio.gz" \
            "$artifact_dir/initramfs.cpio.gz"
          jq -n \
            --arg release_tag "${{ needs.bump-version.outputs.version }}" \
            --arg source_commit "$(git rev-parse HEAD)" \
            --arg openvmm_sha "$(sha256sum "$artifact_dir/openvmm" | cut -d' ' -f1)" \
            --arg kernel_sha "$(sha256sum "$artifact_dir/vmlinux" | cut -d' ' -f1)" \
            --arg initramfs_sha "$(sha256sum "$artifact_dir/initramfs.cpio.gz" | cut -d' ' -f1)" \
            --argjson openvmm_size "$(stat -c %s "$artifact_dir/openvmm")" \
            --argjson kernel_size "$(stat -c %s "$artifact_dir/vmlinux")" \
            --argjson initramfs_size "$(stat -c %s "$artifact_dir/initramfs.cpio.gz")" \
            '{
              schemaVersion:2,
              release:{
                repository:"github/gh-aw-firewall",
                workflow:"github/gh-aw-firewall/.github/workflows/release.yml",
                tag:$release_tag,
                sourceCommit:$source_commit
              },
              upstream:{
                releaseTag:"v0.1.0-dev.8fb0f1d64f2f",
                nvxCommit:"8fb0f1d64f2f67e0017a4f94693244297852ed1f",
                openvmmCommit:"0ac254109ed32fc5fa2b1a6fc526a10593b1f986"
              },
              architecture:"x86_64",
              artifacts:{
                openvmm:{file:"openvmm",sizeBytes:$openvmm_size,sha256:$openvmm_sha},
                kernel:{file:"vmlinux",sizeBytes:$kernel_size,sha256:$kernel_sha},
                initramfs:{
                  file:"initramfs.cpio.gz",
                  sizeBytes:$initramfs_size,
                  sha256:$initramfs_sha
                }
              }
            }' > "$artifact_dir/manifest.json"

      - name: Attest release-pinned NVX artifact manifest
        id: attest_nvx_manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/nvx-test-x86_64/manifest.json

      - name: Bundle NVX manifest attestation
        env:
          BUNDLE_PATH: ${{ steps.attest_nvx_manifest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" \
            release/nvx-test-x86_64/manifest.sigstore.jsonl
          tar -czf release/nvx-test-x86_64.tar.gz \
            -C release/nvx-test-x86_64 \
            openvmm vmlinux initramfs.cpio.gz

      - name: Upload NVX test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-nvx-test-x86_64
          path: |
            release/nvx-test-x86_64.tar.gz
            release/nvx-test-x86_64/manifest.json
            release/nvx-test-x86_64/manifest.sigstore.jsonl
          if-no-files-found: error
          retention-days: 7
