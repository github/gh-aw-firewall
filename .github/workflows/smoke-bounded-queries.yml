name: Smoke Bounded Queries

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-bounded-queries
  cancel-in-progress: false

jobs:
  smoke:
    name: Test all confidentiality levels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build AWF
        run: |
          npm ci
          npm run build
          sudo tee /usr/local/bin/awf > /dev/null <<EOF
          #!/bin/bash
          exec "$(command -v node)" "${GITHUB_WORKSPACE}/dist/cli.js" "\$@"
          EOF
          sudo chmod +x /usr/local/bin/awf

      - name: Exercise bounded queries
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/smoke-bounded-queries.sh
