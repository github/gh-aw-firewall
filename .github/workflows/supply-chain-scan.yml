name: Supply Chain Scan

# Deterministic supply-chain gate that runs on every pull request.
#
# Uses the gh-aw compile pipeline's opt-in Anchore scanners (Syft/Grype/Grant)
# against the container images recorded in the `gh-aw-manifest` headers of the
# compiled `.github/workflows/*.lock.yml` files.
#
# Scanner images are pinned to reviewed digests so scan behaviour is
# reproducible:
#   --syft  versioned via gh-aw (generates SBOMs)
#   grype   ghcr.io/anchore/grype@sha256:fd4ab4d...  (v0.116.0)
#   grant   ghcr.io/anchore/grant@sha256:17246361... (v0.6.8)
#
# Blocking vs. report-only:
#   * BLOCKING gate = "Build and scan PR container images". It rebuilds the
#     first-party images (agent, api-proxy, router, cli-proxy, gh-aw-node) from the
#     Dockerfiles in the PR and fails on any High/Critical CVE. This is the
#     only step that reflects the changes in a PR, so it is the one that gates merges.
#   * REPORT-ONLY = the Grype and Grant scans of the `gh-aw-manifest` digests.
#     Those digests are IMMUTABLE already-published first-party images plus
#     upstream third-party images (playwright, github-mcp-server, mcpg, ...).
#     A PR cannot rebuild or patch them, so their findings are surfaced as
#     warnings but never fail the job (that would make the gate permanently red
#     until the next release / upstream bump).
#
# All scanners run via Docker (pre-installed on `ubuntu-latest`).
# Compile once, then run PR-image CVE, published-image CVE, and license scans
# on separate runners. Keep PR builds sequential to bound disk use and retain
# the shared build-tools image until the enclave-agent build finishes.
#
# To make this a *required* check, add
# "Supply Chain Scan / Compile + Syft/Grype/Grant"
# to the branch protection rule / ruleset for the default branch.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: supply-chain-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile + Syft inventory
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      images: ${{ steps.inventory.outputs.images }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free unused hosted-runner disk space
        # Leave room for Syft to unpack the published images.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Configure Docker Hub cache
        run: bash scripts/ci/configure-docker-mirror.sh

      - name: Checkout gh-aw v1.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          ref: 0627fdbe4beb5f3b71aa569f8d97150b87f2111a
          path: .tmp/gh-aw-compiler
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tmp/gh-aw-compiler/go.mod
          cache: false

      - name: Install patched gh-aw v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C .tmp/gh-aw-compiler apply --unidiff-zero \
            "${GITHUB_WORKSPACE}/scripts/ci/compiler-agent-acceptance-v0.28.66.patch"
          go test -C .tmp/gh-aw-compiler ./pkg/workflow ./pkg/parser \
            -run 'TestValidateCloudHypervisorAgentAcceptance|TestCompileCloudHypervisorAgentAcceptance|TestMainWorkflowSchemaOrdinaryEnclaveTokenLimitAndEvals' -count=1
          mkdir -p "$HOME/.local/share/gh/extensions/gh-aw"
          go build \
            -C .tmp/gh-aw-compiler \
            -ldflags="-X main.version=dev-v1.0.1-agent-acceptance-v0.28.66-budget131072" \
            -o "$HOME/.local/share/gh/extensions/gh-aw/gh-aw" \
            ./cmd/gh-aw
          rm -rf .tmp/gh-aw-compiler
          gh aw version

      - name: Prepare pinned Syft scanner
        run: |
          # Keep the compiler's exact Syft reference so digest-qualified lookups
          # find it locally. The daemon cache also covers ordinary/nested builds.
          docker pull anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a

      - name: Compile + generate SBOMs (Syft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --syft --action-mode action --action-tag v1.0.1 .github/workflows/*.md

      - name: Export compiled image inventory
        id: inventory
        run: |
          python3 - <<'PYEOF'
          import glob, json, os, re
          images = set()
          for path in glob.glob('.github/workflows/*.lock.yml'):
              with open(path) as manifest:
                  m = re.search(r'# gh-aw-manifest: (\{.*\})', manifest.read())
              if m:
                  for c in json.loads(m.group(1)).get('containers', []):
                      images.add(c.get('pinned_image', c.get('image')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('images=' + json.dumps(sorted(images)) + '\n')
          PYEOF

  image-scans:
    name: Scan / ${{ matrix.scan }}
    needs: [compile]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scan: [pr-images, published-cves, licenses]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free unused hosted-runner disk space
        if: matrix.scan == 'pr-images'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Configure Docker Hub cache
        run: bash scripts/ci/configure-docker-mirror.sh

      - name: Prepare pinned Grype scanner
        if: matrix.scan != 'licenses'
        run: docker pull ghcr.io/anchore/grype@sha256:fd4ab4d1042b522c896e73bdf09ab8bf384fa417df99d6dd0d6e1008c7e7c821

      - name: Prepare pinned Grant scanner
        if: matrix.scan == 'licenses'
        run: docker pull ghcr.io/anchore/grant@sha256:172463611795f43b77302cdfbd7b3f81295492a7330e0820cfe41c3674920237

      - name: Authenticate to GHCR for image scanning
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Persist Grype's vulnerability DB across runs. The unique run_id key never
      # hits exactly, so each run restores the newest prior DB via restore-keys,
      # refreshes it if a newer DB exists (see `db update` below), then saves the
      # result under a fresh per-matrix key so concurrent scans never race to save.
      #
      # Using separate restore + save steps so the DB is saved immediately after
      # a successful warm-up regardless of whether later Grype scans flag CVEs
      # (Grype exits nonzero on --fail-on high findings, which would prevent the
      # combined actions/cache post-step from uploading the warmed DB).
      - name: Restore Grype vulnerability DB cache
        if: matrix.scan != 'licenses'
        id: grype-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grype-db
          key: grype-db-v6-${{ github.run_id }}-${{ matrix.scan }}
          restore-keys: |
            grype-db-v6-

      - name: Warm Grype vulnerability DB
        if: matrix.scan != 'licenses'
        env:
          GRYPE_DB: ${{ runner.temp }}/grype-db
        run: |
          mkdir -p "$GRYPE_DB"
          # Warm (or refresh) the vulnerability DB exactly once. Without a shared
          # cache, every per-image `docker run --rm` would re-download the full DB
          # (~1 min each), which is the dominant cost of this job.
          docker run --rm \
            -v "$GRYPE_DB:/cache" \
            -e GRYPE_DB_CACHE_DIR=/cache \
            ghcr.io/anchore/grype@sha256:fd4ab4d1042b522c896e73bdf09ab8bf384fa417df99d6dd0d6e1008c7e7c821 \
            db update

      - name: Save Grype vulnerability DB cache
        if: matrix.scan != 'licenses'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grype-db
          key: grype-db-v6-${{ github.run_id }}-${{ matrix.scan }}

      - name: Scan published & third-party images for CVEs (report-only, Grype v0.116.0)
        if: matrix.scan == 'published-cves'
        # Scans the immutable image digests recorded in the compiled .lock.yml
        # gh-aw-manifest headers: already-published first-party images plus
        # upstream third-party images that a PR cannot rebuild. Findings are
        # REPORTED as warnings but do NOT fail the job. The blocking CVE gate is
        # the "Build and scan PR container images" step below.
        # ghcr.io/anchore/grype@sha256:fd4ab4d1042b522c896e73bdf09ab8bf384fa417df99d6dd0d6e1008c7e7c821 = v0.116.0
        env:
          GRYPE_DB: ${{ runner.temp }}/grype-db
          MANIFEST_IMAGES: ${{ needs.compile.outputs.images }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys
          images = json.loads(os.environ['MANIFEST_IMAGES'])
          home = os.path.expanduser('~')
          db_cache = os.environ['GRYPE_DB']
          cwd = os.getcwd()
          flagged = []
          for image in sorted(images):
              print(f'::group::grype {image}', flush=True)
              r = subprocess.run([
                  'docker', 'run', '--rm',
                  '-v', f'{home}/.docker/config.json:/root/.docker/config.json:ro',
                  '-v', f'{db_cache}:/cache',
                  '-e', 'GRYPE_DB_CACHE_DIR=/cache',
                  '-e', 'GRYPE_DB_AUTO_UPDATE=false',
                  '-e', 'GRYPE_CHECK_FOR_APP_UPDATE=false',
                  '-v', f'{cwd}/.grype.yaml:/root/.grype.yaml:ro',
                  'ghcr.io/anchore/grype@sha256:fd4ab4d1042b522c896e73bdf09ab8bf384fa417df99d6dd0d6e1008c7e7c821',
                  f'registry:{image}', '--fail-on', 'high',
                  '--config', '/root/.grype.yaml',
              ])
              print('::endgroup::', flush=True)
              if r.returncode != 0:
                  flagged.append(image)
          if flagged:
              print(f'::warning::{len(flagged)} published/third-party image(s) have High/Critical CVEs '
                    f'(report-only, not blocking): ' + ', '.join(flagged), flush=True)
          # Report-only: never fail the job on immutable published / third-party images.
          sys.exit(0)
          PYEOF

      - name: Build and scan PR container images (BLOCKING gate, Grype v0.116.0)
        if: matrix.scan == 'pr-images'
        # Builds every production image from the Dockerfiles in
        # this PR and scans them with --fail-on high. This is the BLOCKING supply-chain
        # gate: it is the only scan that reflects the CVE fixes in a PR, so a
        # High/Critical finding here fails the job.
        env:
          GRYPE_DB: ${{ runner.temp }}/grype-db
        run: |
          python3 - <<'PYEOF'
          import hashlib, os, subprocess, sys
          cwd = os.getcwd()
          db_cache = os.environ['GRYPE_DB']
          # The router build requires the SHA-256 of its OpenAPI contract.
          with open('containers/router/openapi.yaml', 'rb') as f:
              router_openapi_sha256 = hashlib.sha256(f.read()).hexdigest()
          containers = [
              ('build-tools',         'containers/build-tools', []),
              ('agent',               'containers/agent',     []),
              ('api-proxy',           'containers/api-proxy', []),
              ('router',              'containers/router',    ['--build-arg', f'OPENAPI_SHA256={router_openapi_sha256}']),
              ('cli-proxy',           'containers/cli-proxy', []),
              ('gh-aw-node',          'containers/gh-aw-node', []),
              ('enclave-script',      'containers', ['-f', 'containers/enclave/Dockerfile', '--target', 'enclave-script']),
              ('enclave-agent',       'containers', ['-f', 'containers/enclave/Dockerfile', '--target', 'enclave-agent', '--build-arg', 'BUILD_TOOLS_IMAGE=awf-pr-scan-build-tools:pr']),
              ('enclave-mcp-server',  'containers', ['-f', 'containers/enclave/Dockerfile', '--target', 'enclave-mcp-server']),
          ]
          def report_disk(label):
              print(f'::group::disk usage ({label})', flush=True)
              subprocess.run(['df', '-h', '/', '/tmp'])
              subprocess.run(['docker', 'system', 'df'])
              print('::endgroup::', flush=True)
          def prune_build_cache():
              # Builder stages are not needed after the exact image exists. Images,
              # including the retained base and pinned scanners, are not pruned.
              subprocess.run(
                  ['docker', 'builder', 'prune', '--all', '--force'],
                  stdout=subprocess.DEVNULL,
                  check=True,
              )
          rc = 0
          build_tools_ready = False
          retained_base = None
          report_disk('before PR image builds')
          try:
              for name, context, build_args in containers:
                  if name == 'enclave-agent' and not build_tools_ready:
                      print('::error::enclave-agent requires the successful PR build-tools build', flush=True)
                      rc = 1
                      continue
                  tag = f'awf-pr-scan-{name}:pr'
                  tar = f'/tmp/awf-pr-scan-{name}.tar'
                  print(f'::group::docker build {name}', flush=True)
                  b = subprocess.run(['docker', 'build', *build_args, '-t', tag, context])
                  print('::endgroup::', flush=True)
                  prune_build_cache()
                  if b.returncode != 0:
                      print(f'::error::docker build failed for {name}', flush=True)
                      rc = b.returncode
                      continue
                  if name == 'build-tools':
                      build_tools_ready = True
                      # Keep the exact locally built base until all dependents finish.
                      retained_base = tag
                  try:
                      subprocess.run(['docker', 'save', '-o', tar, tag], check=True)
                      print(f'::group::grype {name} (PR build)', flush=True)
                      r = subprocess.run([
                          'docker', 'run', '--rm',
                          '-v', f'{tar}:{tar}:ro',
                          '-v', f'{db_cache}:/cache',
                          '-e', 'GRYPE_DB_CACHE_DIR=/cache',
                          '-e', 'GRYPE_DB_AUTO_UPDATE=false',
                          '-e', 'GRYPE_CHECK_FOR_APP_UPDATE=false',
                          '-v', f'{cwd}/.grype.yaml:/root/.grype.yaml:ro',
                          'ghcr.io/anchore/grype@sha256:fd4ab4d1042b522c896e73bdf09ab8bf384fa417df99d6dd0d6e1008c7e7c821',
                          f'docker-archive:{tar}', '--fail-on', 'high',
                          '--config', '/root/.grype.yaml',
                      ])
                      print('::endgroup::', flush=True)
                      if r.returncode != 0:
                          rc = r.returncode
                  finally:
                      if os.path.exists(tar):
                          os.remove(tar)
                      if tag != retained_base:
                          subprocess.run(
                              ['docker', 'image', 'rm', '--force', tag],
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,
                          )
          finally:
              if retained_base is not None:
                  subprocess.run(
                      ['docker', 'image', 'rm', '--force', retained_base],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
              report_disk('after PR image scans')
          sys.exit(rc)
          PYEOF

      - name: Check image licenses (report-only, Grant v0.6.8)
        if: matrix.scan == 'licenses'
        # License findings on the immutable published / third-party manifest
        # digests are reported as warnings but do NOT fail the job (same
        # rationale as the report-only CVE scan above).
        # ghcr.io/anchore/grant@sha256:172463611795f43b77302cdfbd7b3f81295492a7330e0820cfe41c3674920237 = v0.6.8
        env:
          MANIFEST_IMAGES: ${{ needs.compile.outputs.images }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys
          images = json.loads(os.environ['MANIFEST_IMAGES'])
          home = os.path.expanduser('~')
          cwd = os.getcwd()
          flagged = []
          for image in sorted(images):
              print(f'::group::grant {image}', flush=True)
              r = subprocess.run([
                  'docker', 'run', '--rm',
                  '-v', f'{home}/.docker/config.json:/root/.docker/config.json:ro',
                  '-v', f'{cwd}/.grant.yaml:/tmp/grant.yaml',
                  'ghcr.io/anchore/grant@sha256:172463611795f43b77302cdfbd7b3f81295492a7330e0820cfe41c3674920237',
                  'check', '-c', '/tmp/grant.yaml', image,
              ])
              print('::endgroup::', flush=True)
              if r.returncode != 0:
                  flagged.append(image)
          if flagged:
              print(f'::warning::{len(flagged)} image(s) have license findings '
                    f'(report-only, not blocking): ' + ', '.join(flagged), flush=True)
          # Report-only: never fail the job on immutable published / third-party images.
          sys.exit(0)
          PYEOF

  scan:
    name: Compile + Syft/Grype/Grant
    needs: [compile, image-scans]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require compilation and all scan jobs to succeed
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          SCANS_RESULT: ${{ needs.image-scans.result }}
        run: |
          echo "Compilation: $COMPILE_RESULT; scans: $SCANS_RESULT"
          test "$COMPILE_RESULT" = success
          test "$SCANS_RESULT" = success
