name: Cloud Hypervisor Enclave Conformance

on:
  workflow_dispatch:
    inputs:
      artifact_mode:
        description: Published release acceptance or same-commit attested PR candidate validation
        type: choice
        options:
          - release
          - candidate
        default: release
        required: true
      run_host_probes:
        description: Run privileged host-limit probes (not broker-to-VM acceptance)
        required: true
        type: boolean
        default: false
      run_live_kvm:
        description: Run script and agent enclave VM acceptance with the selected attested artifacts
        required: true
        type: boolean
        default: false
      run_environment_probe:
        description: Run the script-only public environment probe with the selected attested artifacts (no model or Copilot secret)
        required: true
        type: boolean
        default: false
      acceptance_commit:
        description: Full reviewed SHA (release ancestry, or exact branch HEAD for candidate mode)
        required: false
        type: string
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/test-cloud-hypervisor-enclaves.yml'
      - '.github/workflows/test-cloud-hypervisor.yml'
      - 'src/cloud-hypervisor/**'
      - 'src/enclave/**'
      - 'src/microvm/**'
      - 'src/bounded-execution/**'
      - 'src/types/enclave-options.ts'
      - 'src/parsers/enclave-parser.ts'
      - 'src/commands/main-action*'
      - 'src/cli-workflow*'
      - 'src/services/enclave-mcp-service*'
      - 'containers/enclave/**'
      - 'containers/build-tools/**'
      - 'containers/cloud-hypervisor/**'
      - 'containers/bounded-execution/**'
      - 'guest/microvm-supervisor/**'
      - 'scripts/ci/*cloud-hypervisor*.test.ts'
      - 'scripts/ci/cloud-hypervisor-enclave-live-smoke.js'
      - 'scripts/ci/cloud-hypervisor-enclave-release-gate.js'
      - 'scripts/ci/cloud-hypervisor-enclave-candidate.js'
      - 'scripts/ci/cloud-hypervisor-enclave-startup-faults.js'
      - 'scripts/ci/cloud-hypervisor-enclave-gateway*'
      - 'scripts/ci/cloud-hypervisor-enclave-environment-probe.js'
      - 'scripts/ci/cloud-hypervisor-enclave-host-preflight.js'
      - 'examples/enclave-environment-probe/**'
      - 'docs/cloud-hypervisor-foundation.md'
      - 'docs/INTEGRATION-TESTS.md'
      - 'docs/enclaves-architecture.md'
      - 'docs/awf-config-spec.md'
      - 'package*.json'
      - 'jest.config.js'

permissions:
  contents: read

concurrency:
  group: cloud-hypervisor-enclaves-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic:
    name: Deterministic enclave contract (no KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWF_TEST_ENCLAVE_STORAGE: '0'
      AWF_TEST_ENCLAVE_NETWORK: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: guest/microvm-supervisor/go.mod
      - name: Install dependencies and check types
        run: npm ci && npm run build && npm run type-check
      - name: Run deterministic enclave conformance
        run: |
          npm test -- --ci --runInBand --runTestsByPath \
            src/enclave/host-executor-broker.test.ts \
            src/enclave/host-executor-protocol.test.ts \
            src/enclave/host-executor-journal.test.ts \
            src/enclave/cloud-hypervisor-lifecycle.test.ts \
            src/enclave/cloud-hypervisor-host-service.test.ts \
            src/enclave/manager.test.ts \
            src/enclave/gateway.test.ts \
            src/enclave/startup-progress.test.ts \
            src/enclave/workflow-integration.test.ts \
            src/enclave/preflight.test.ts \
            scripts/ci/cloud-hypervisor-conformance-admission.test.ts \
            src/enclave/runtime-preflight.test.ts \
            src/services/enclave-mcp-service.test.ts \
            src/commands/main-action.test.ts \
            src/commands/main-action-startup-diagnostics.test.ts \
            src/cli-workflow.test.ts \
            src/cloud-hypervisor/host-enclave-executor.test.ts \
            src/cloud-hypervisor/enclave-storage.test.ts \
            src/cloud-hypervisor/trusted-enclave-storage.test.ts \
            src/cloud-hypervisor/trusted-enclave-preflight.test.ts \
            src/cloud-hypervisor/host-preflight-progress.test.ts \
            src/cloud-hypervisor/mount-topology.test.ts \
            src/cloud-hypervisor/artifact-trust.test.ts \
            src/cloud-hypervisor/artifact-snapshot.test.ts \
            src/cloud-hypervisor/preflight.test.ts \
            src/cloud-hypervisor/enclave-export-plan.test.ts \
            src/cloud-hypervisor/enclave-network.test.ts \
            src/cloud-hypervisor/workload-profile.test.ts \
            src/cloud-hypervisor/unified-lifecycle.test.ts \
            src/cloud-hypervisor/manager-launch.test.ts \
            src/cloud-hypervisor/manager-construction.test.ts \
            src/cloud-hypervisor/manager-diagnostics.test.ts \
            src/cloud-hypervisor/manager-cleanup.test.ts \
            src/cloud-hypervisor/cleanup-identity.test.ts \
            src/cloud-hypervisor/cleanup-process.test.ts \
            src/cloud-hypervisor/host-eligibility.test.ts \
            scripts/ci/cloud-hypervisor-enclave-artifacts.test.ts \
            scripts/ci/cloud-hypervisor-enclave-live-smoke.test.ts \
            scripts/ci/cloud-hypervisor-enclave-gateway.test.ts \
            scripts/ci/cloud-hypervisor-enclave-release-gate.test.ts \
            scripts/ci/cloud-hypervisor-enclave-candidate.test.ts \
            scripts/ci/cloud-hypervisor-enclave-startup-faults.test.ts \
            scripts/ci/cloud-hypervisor-enclave-environment-probe.test.ts \
            scripts/ci/cloud-hypervisor-enclave-host-preflight.test.ts \
            scripts/ci/cloud-hypervisor-environment-probe.test.ts \
            scripts/ci/test-cloud-hypervisor-enclave-workflow.test.ts \
            scripts/ci/test-cloud-hypervisor-workflow.test.ts

  candidate-artifacts:
    name: Build same-commit attested candidate artifacts
    needs: deterministic
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.artifact_mode == 'candidate' &&
      (inputs.run_live_kvm || inputs.run_environment_probe)
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/test-cloud-hypervisor.yml
    with:
      candidate_build: true
      run_live_kvm: false
      candidate_commit: ${{ inputs.acceptance_commit }}

  host-probes:
    name: Privileged enclave host boundaries (not live VM acceptance)
    needs: deterministic
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_host_probes) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'cloud-hypervisor-enclave-conformance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: guest/microvm-supervisor/go.mod
      - name: Install dependencies and build eligibility helper
        run: npm ci && npm run build
      - name: Require eligible GitHub-hosted Ubuntu x86_64 KVM runner
        run: |
          set -euo pipefail
          node -e "require('./dist/cloud-hypervisor/host-eligibility').assertGithubHostedRunnerEligibility()"
          sudo -n "$(command -v node)" -e '
            const fs = require("fs");
            if (!fs.statSync("/dev/kvm").isCharacterDevice()) throw new Error("KVM device required");
            const fd = fs.openSync("/dev/kvm", "r+");
            fs.closeSync(fd);
          '
          test -r /sys/fs/cgroup/cgroup.controllers
          sudo -n test -w /sys/fs/cgroup
      - name: Probe production host admission (not AWF or guest execution)
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,ImageOS env "PATH=$PATH" "$(command -v node)" \
            scripts/ci/cloud-hypervisor-enclave-host-preflight.js
      - name: Install host probe prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nftables iproute2 curl
      - name: Probe mount capture hypotheses (not VM acceptance)
        run: |
          sudo -n unshare --mount --propagation private \
            env "PATH=$PATH" AWF_TEST_ENCLAVE_STORAGE=1 \
            ./node_modules/.bin/jest --ci --runInBand --runTestsByPath \
            src/cloud-hypervisor/enclave-mount-capture.integration.test.ts
      - name: Probe real aggregate storage and network enforcement
        run: |
          sudo -n unshare --mount --propagation private \
            env "PATH=$PATH" AWF_TEST_ENCLAVE_STORAGE=1 AWF_TEST_ENCLAVE_NETWORK=1 \
            ./node_modules/.bin/jest --ci --runInBand --runTestsByPath \
            src/cloud-hypervisor/enclave-storage.integration.test.ts \
            src/cloud-hypervisor/enclave-trusted-storage.integration.test.ts \
            src/cloud-hypervisor/enclave-network.integration.test.ts
      - name: Probe guest supervisor limits in a private host namespace
        working-directory: guest/microvm-supervisor
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/enclave-supervisor.test" .
          sudo -n AWF_REQUIRE_LIVE_GUEST_PROBE=1 \
            "$RUNNER_TEMP/enclave-supervisor.test" \
            -test.run '^TestEnclaveGuestLimitsLive$' -test.count=1 -test.v
      - name: Remove probe executable
        if: always()
        run: rm -f "$RUNNER_TEMP/enclave-supervisor.test"

  live-kvm:
    name: Live enclave broker-to-VM acceptance
    needs: [deterministic, candidate-artifacts]
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' &&
      inputs.run_live_kvm && needs.deterministic.result == 'success' &&
      ((inputs.artifact_mode == 'candidate' && needs.candidate-artifacts.result == 'success') ||
       (inputs.artifact_mode != 'candidate' && needs.candidate-artifacts.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AWF_ENCLAVE_ACCEPTANCE_MODE: ${{ inputs.artifact_mode || 'release' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and build AWF
        if: inputs.artifact_mode != 'candidate'
        run: npm ci && npm run build && npm run type-check
      - name: Download same-run candidate artifacts
        if: inputs.artifact_mode == 'candidate'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-hypervisor-test-x86_64
          path: ${{ runner.temp }}/cloud-hypervisor-test-x86_64
      - name: Build candidate-only host compatibility profile
        if: inputs.artifact_mode == 'candidate'
        env:
          AWF_ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
          AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS: ${{ runner.temp }}/cloud-hypervisor-test-x86_64
        run: |
          node scripts/ci/cloud-hypervisor-enclave-candidate.js configure
          chmod 0755 "$AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS/cloud-hypervisor" \
            "$AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS/virtiofsd" \
            "$AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS/awf-supervisor"
          npm ci && npm run build && npm run type-check
      - name: Require exact published release source containing the reviewed acceptance commit
        if: inputs.artifact_mode != 'candidate'
        env:
          AWF_ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/ci/cloud-hypervisor-enclave-release-gate.js
          tag="$(node -p "require('./dist/cloud-hypervisor/artifact-manifest').CLOUD_HYPERVISOR_ARTIFACT_RELEASE_TAG")"
          gh release view "$tag" --repo github/gh-aw-firewall --json isDraft \
            --jq 'if .isDraft then error("Acceptance requires a published release") else "Published release verified" end'
      - name: Require exact reviewed candidate source
        if: inputs.artifact_mode == 'candidate'
        env:
          AWF_ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
        run: node scripts/ci/cloud-hypervisor-enclave-candidate.js verify
      - name: Verify GitHub-hosted Ubuntu x86_64 KVM and cgroup-v2 host
        run: |
          set -euo pipefail
          node -e "require('./dist/cloud-hypervisor/host-eligibility').assertGithubHostedRunnerEligibility()"
          sudo -n "$(command -v node)" -e '
            const fs = require("fs");
            if (!fs.statSync("/dev/kvm").isCharacterDevice()) throw new Error("KVM device required");
            const fd = fs.openSync("/dev/kvm", "r+");
            fs.closeSync(fd);
          '
          test -r /sys/fs/cgroup/cgroup.controllers
          sudo -n test -w /sys/fs/cgroup
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            e2fsprogs iproute2 jq nftables rsync util-linux
      - name: Build the isolated public MCP gateway fixture
        run: |
          docker build \
            --file scripts/ci/cloud-hypervisor-enclave-gateway.Dockerfile \
            --tag awf-cloud-hypervisor-enclave-live-gateway:test \
            .
      - name: Run release-attested or candidate-attested live script and agent enclave acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AWF_ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
          AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS: ${{ runner.temp }}/cloud-hypervisor-test-x86_64
        run: |
          set -euo pipefail
          sudo -n --preserve-env=PATH,HOME,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_REF_TYPE,GITHUB_REF_NAME,GITHUB_SHA,GITHUB_WORKFLOW_REF,GITHUB_WORKFLOW_SHA,RUNNER_ENVIRONMENT,ImageOS,RUNNER_TEMP,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GH_TOKEN,GITHUB_TOKEN,COPILOT_GITHUB_TOKEN,AWF_ACCEPTANCE_COMMIT,AWF_ENCLAVE_ACCEPTANCE_MODE,AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS \
            node scripts/ci/cloud-hypervisor-enclave-live-smoke.js
      - name: Remove only this job's gateway fixture
        if: always()
        run: |
          set -euo pipefail
          identity="gh-aw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-enclave-live"
          if docker inspect \
            --format '{{ index .Config.Labels "com.github.gh-aw.mcpg.run" }}' \
            awmg-mcpg 2>/dev/null | grep --fixed-strings --line-regexp --quiet "$identity"; then
            docker rm --force awmg-mcpg
          fi

  environment-probe:
    name: Public enclave environment probe (script-only, attested VM)
    # Independent of the full acceptance and host-limit suites; it repeats its own release,
    # host, artifact, and readiness prerequisites below rather than skipping them.
    needs: candidate-artifacts
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' &&
      inputs.run_environment_probe &&
      ((inputs.artifact_mode == 'candidate' && needs.candidate-artifacts.result == 'success') ||
       (inputs.artifact_mode != 'candidate' && needs.candidate-artifacts.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWF_ENCLAVE_ACCEPTANCE_MODE: ${{ inputs.artifact_mode || 'release' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and build AWF
        if: inputs.artifact_mode != 'candidate'
        run: npm ci && npm run build && npm run type-check
      - name: Download same-run candidate artifacts
        if: inputs.artifact_mode == 'candidate'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-hypervisor-test-x86_64
          path: ${{ runner.temp }}/cloud-hypervisor-test-x86_64
      - name: Build candidate-only host compatibility profile
        if: inputs.artifact_mode == 'candidate'
        env:
          AWF_ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
          AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS: ${{ runner.temp }}/cloud-hypervisor-test-x86_64
        run: |
          node scripts/ci/cloud-hypervisor-enclave-candidate.js configure
          chmod 0755 "$AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS/cloud-hypervisor" \
            "$AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS/virtiofsd" \
            "$AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS/awf-supervisor"
          npm ci && npm run build && npm run type-check
      - name: Require exact published release source containing the reviewed probe integration
        if: inputs.artifact_mode != 'candidate'
        env:
          AWF_ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/ci/cloud-hypervisor-enclave-release-gate.js --environment-probe
          tag="$(node -p "require('./dist/cloud-hypervisor/artifact-manifest').CLOUD_HYPERVISOR_ARTIFACT_RELEASE_TAG")"
          gh release view "$tag" --repo github/gh-aw-firewall --json isDraft \
            --jq 'if .isDraft then error("Acceptance requires a published release") else "Published release verified" end'
      - name: Require exact reviewed candidate source
        if: inputs.artifact_mode == 'candidate'
        env:
          AWF_ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
        run: node scripts/ci/cloud-hypervisor-enclave-candidate.js verify-environment-probe
      - name: Validate the probe and its harness locally (no KVM)
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s examples/enclave-environment-probe -q
          npm test -- --ci --runInBand --runTestsByPath \
            scripts/ci/cloud-hypervisor-environment-probe.test.ts \
            scripts/ci/cloud-hypervisor-enclave-environment-probe.test.ts \
            scripts/ci/cloud-hypervisor-enclave-release-gate.test.ts
      - name: Verify GitHub-hosted Ubuntu x86_64 KVM and cgroup-v2 host
        run: |
          set -euo pipefail
          node -e "require('./dist/cloud-hypervisor/host-eligibility').assertGithubHostedRunnerEligibility()"
          sudo -n "$(command -v node)" -e '
            const fs = require("fs");
            if (!fs.statSync("/dev/kvm").isCharacterDevice()) throw new Error("KVM device required");
            const fd = fs.openSync("/dev/kvm", "r+");
            fs.closeSync(fd);
          '
          test -r /sys/fs/cgroup/cgroup.controllers
          sudo -n test -w /sys/fs/cgroup
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            e2fsprogs iproute2 jq nftables rsync util-linux
      - name: Build the isolated public MCP gateway fixture
        run: |
          docker build \
            --file scripts/ci/cloud-hypervisor-enclave-gateway.Dockerfile \
            --tag awf-cloud-hypervisor-enclave-live-gateway:test \
            .
      - name: Run the public environment probe through the script enclave MCP route
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          AWF_ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
          AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS: ${{ runner.temp }}/cloud-hypervisor-test-x86_64
        run: |
          set -euo pipefail
          sudo -n --preserve-env=PATH,HOME,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_REF_TYPE,GITHUB_REF_NAME,GITHUB_SHA,GITHUB_WORKFLOW_REF,GITHUB_WORKFLOW_SHA,RUNNER_ENVIRONMENT,ImageOS,RUNNER_TEMP,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GH_TOKEN,GITHUB_TOKEN,AWF_ACCEPTANCE_COMMIT,AWF_ENCLAVE_ACCEPTANCE_MODE,AWF_CLOUD_HYPERVISOR_CANDIDATE_ARTIFACTS \
            node scripts/ci/cloud-hypervisor-enclave-environment-probe.js
      - name: Remove only this job's gateway fixture
        if: always()
        run: |
          set -euo pipefail
          identity="gh-aw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-enclave-probe"
          if docker inspect \
            --format '{{ index .Config.Labels "com.github.gh-aw.mcpg.run" }}' \
            awmg-mcpg 2>/dev/null | grep --fixed-strings --line-regexp --quiet "$identity"; then
            docker rm --force awmg-mcpg
          fi
