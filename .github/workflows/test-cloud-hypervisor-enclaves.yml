name: Cloud Hypervisor Enclave Conformance

on:
  workflow_dispatch:
    inputs:
      run_host_probes:
        description: Run privileged host-limit probes (not broker-to-VM acceptance)
        required: true
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/test-cloud-hypervisor-enclaves.yml'
      - '.github/workflows/test-cloud-hypervisor.yml'
      - 'src/cloud-hypervisor/**'
      - 'src/enclave/**'
      - 'src/microvm/**'
      - 'src/bounded-execution/**'
      - 'src/types/enclave-options.ts'
      - 'src/parsers/enclave-parser.ts'
      - 'src/commands/main-action*'
      - 'src/services/enclave-mcp-service*'
      - 'containers/enclave/**'
      - 'containers/bounded-execution/**'
      - 'guest/microvm-supervisor/**'
      - 'scripts/ci/*cloud-hypervisor*.test.ts'
      - 'docs/cloud-hypervisor-foundation.md'
      - 'docs/INTEGRATION-TESTS.md'
      - 'package*.json'
      - 'jest.config.js'

permissions:
  contents: read

concurrency:
  group: cloud-hypervisor-enclaves-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic:
    name: Deterministic enclave contract (no KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWF_TEST_ENCLAVE_STORAGE: '0'
      AWF_TEST_ENCLAVE_NETWORK: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: guest/microvm-supervisor/go.mod
      - name: Install dependencies and check types
        run: npm ci && npm run build && npm run type-check
      - name: Run deterministic enclave conformance
        run: |
          npm test -- --ci --runInBand --runTestsByPath \
            src/enclave/host-executor-broker.test.ts \
            src/enclave/host-executor-protocol.test.ts \
            src/enclave/host-executor-journal.test.ts \
            src/enclave/cloud-hypervisor-lifecycle.test.ts \
            src/enclave/cloud-hypervisor-host-service.test.ts \
            src/enclave/manager.test.ts \
            src/enclave/preflight.test.ts \
            src/enclave/runtime-preflight.test.ts \
            src/services/enclave-mcp-service.test.ts \
            src/commands/main-action.test.ts \
            src/cloud-hypervisor/host-enclave-executor.test.ts \
            src/cloud-hypervisor/enclave-storage.test.ts \
            src/cloud-hypervisor/enclave-export-plan.test.ts \
            src/cloud-hypervisor/enclave-network.test.ts \
            src/cloud-hypervisor/workload-profile.test.ts \
            src/cloud-hypervisor/manager-launch.test.ts \
            src/cloud-hypervisor/manager-construction.test.ts \
            src/cloud-hypervisor/manager-diagnostics.test.ts \
            src/cloud-hypervisor/manager-cleanup.test.ts \
            src/cloud-hypervisor/cleanup-identity.test.ts \
            src/cloud-hypervisor/host-eligibility.test.ts \
            scripts/ci/cloud-hypervisor-enclave-artifacts.test.ts \
            scripts/ci/test-cloud-hypervisor-enclave-workflow.test.ts \
            scripts/ci/test-cloud-hypervisor-workflow.test.ts

  host-probes:
    name: Privileged enclave host boundaries (not live VM acceptance)
    needs: deterministic
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_host_probes) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'cloud-hypervisor-enclave-conformance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache-dependency-path: guest/microvm-supervisor/go.mod
      - name: Install dependencies and build eligibility helper
        run: npm ci && npm run build
      - name: Require eligible GitHub-hosted Ubuntu x86_64 KVM runner
        run: |
          set -euo pipefail
          node -e "require('./dist/cloud-hypervisor/host-eligibility').assertGithubHostedRunnerEligibility()"
          sudo -n "$(command -v node)" -e '
            const fs = require("fs");
            if (!fs.statSync("/dev/kvm").isCharacterDevice()) throw new Error("KVM device required");
            const fd = fs.openSync("/dev/kvm", "r+");
            fs.closeSync(fd);
          '
          test -r /sys/fs/cgroup/cgroup.controllers
          sudo -n test -w /sys/fs/cgroup
      - name: Install host probe prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nftables iproute2 curl
      - name: Probe real aggregate storage and network enforcement
        run: |
          sudo -n unshare --mount --propagation private \
            env "PATH=$PATH" AWF_TEST_ENCLAVE_STORAGE=1 AWF_TEST_ENCLAVE_NETWORK=1 \
            ./node_modules/.bin/jest --ci --runInBand --runTestsByPath \
            src/cloud-hypervisor/enclave-storage.integration.test.ts \
            src/cloud-hypervisor/enclave-network.integration.test.ts
      - name: Probe guest supervisor limits in a private host namespace
        working-directory: guest/microvm-supervisor
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/enclave-supervisor.test" .
          sudo -n AWF_REQUIRE_LIVE_GUEST_PROBE=1 \
            "$RUNNER_TEMP/enclave-supervisor.test" \
            -test.run '^TestEnclaveGuestLimitsLive$' -test.count=1 -test.v
      - name: Remove probe executable
        if: always()
        run: rm -f "$RUNNER_TEMP/enclave-supervisor.test"
