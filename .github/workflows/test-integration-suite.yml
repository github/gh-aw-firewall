name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/

jobs:
  build-images:
    name: Build integration images
    if: github.event_name != 'pull_request' || github.event.label.name == 'ready-for-aw'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub Actions cache runtime for Buildx CLI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name} for Buildx cache`);
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }

      - name: Build local containers
        shell: bash
        env:
          EXPORT_BUILD_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          echo "=== Building local containers ==="
          echo "## Image build cache diagnostics" >> "$GITHUB_STEP_SUMMARY"
          for image in squid agent api-proxy; do
            cache_args=(--cache-from "type=gha,version=2,scope=it-${image}")
            if [ "$EXPORT_BUILD_CACHE" = true ]; then
              cache_args+=(--cache-to "type=gha,version=2,scope=it-${image},mode=max,ignore-error=true")
            fi
            for attempt in 1 2 3; do
              started=$SECONDS
              log_file="$RUNNER_TEMP/build-${image}-${attempt}.log"
              if docker buildx build --progress=plain --load "${cache_args[@]}" -t "ghcr.io/github/gh-aw-firewall/${image}:latest" "containers/${image}/" 2>&1 | tee "$log_file"; then
                status=0
              else
                status=$?
              fi
              {
                echo "### ${image}, attempt ${attempt}"
                echo "- Duration: $((SECONDS - started))s; exit status: ${status}"
                echo "- Cached steps: $(grep -c ' CACHED$' "$log_file" || true)"
                echo "- Cache imports: $(grep -cE 'importing cache' "$log_file" || true)"
                echo "- Cache exports: $(grep -cE 'exporting.*cache' "$log_file" || true)"
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "$status" -eq 0 ]; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit "$status"
              fi
              sleep $((attempt * 10))
            done
          done

      - name: Save integration images
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/integration-images"
          docker save ghcr.io/github/gh-aw-firewall/squid:latest \
            ghcr.io/github/gh-aw-firewall/agent:latest \
            ghcr.io/github/gh-aw-firewall/api-proxy:latest \
            | gzip -1 > "$RUNNER_TEMP/integration-images/images.tar.gz"
          test -s "$RUNNER_TEMP/integration-images/images.tar.gz"
          {
            echo "## Image artifact"
            echo "- Save and compression: ${SECONDS}s"
            echo "- Compressed bytes: $(stat -c %s "$RUNNER_TEMP/integration-images/images.tar.gz")"
            docker image inspect --format '{{.RepoTags}}: {{.Size}} bytes' \
              ghcr.io/github/gh-aw-firewall/squid:latest ghcr.io/github/gh-aw-firewall/agent:latest
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-images
          path: ${{ runner.temp }}/integration-images/images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test-domain:
    name: Domain Tests
    needs: build-images
    if: always() && (github.event_name != 'pull_request' || github.event.label.name == 'ready-for-aw')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Fail if integration images were not built
        if: always() && needs.build-images.result != 'success'
        run: |
          echo "Integration image build did not succeed" >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Download integration images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-images
          path: ${{ runner.temp }}/integration-images

      - name: Load integration images
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/integration-images/images.tar.gz"
          gunzip -c "$RUNNER_TEMP/integration-images/images.tar.gz" | docker load
          docker image inspect ghcr.io/github/gh-aw-firewall/squid:latest ghcr.io/github/gh-aw-firewall/agent:latest ghcr.io/github/gh-aw-firewall/api-proxy:latest > /dev/null
          docker images
          echo "Image load: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Pre-test cleanup
        run: |
          echo "=== Pre-test cleanup ==="
          ./scripts/ci/cleanup.sh || true

      - name: Run domain tests
        run: |
          echo "=== Running domain tests ==="
          npm run test:integration -- \
            --testPathPatterns="(blocked-domains|dns-servers|empty-domains|wildcard-patterns|no-docker|skip-pull|sudo-secure-path|git-operations)" \
            --verbose --json --outputFile=/tmp/awf-jest-domain.json
        env:
          JEST_TIMEOUT: 180000

      - name: Upload Jest timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jest-timings-domain
          path: /tmp/awf-jest-domain.json
          retention-days: 7

      - name: Post-test cleanup
        if: always()
        run: |
          echo "=== Post-test cleanup ==="
          ./scripts/ci/cleanup.sh || true

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Collecting failure logs ==="
          docker ps -a || true
          docker logs awf-squid 2>&1 || true
          docker logs awf-agent 2>&1 || true
          ls -la /tmp/awf-* 2>/dev/null || true
          sudo cat /tmp/awf-*/squid-logs/access.log 2>/dev/null || true

