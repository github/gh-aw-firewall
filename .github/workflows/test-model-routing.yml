name: Released Model Routing Compatibility Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-model-routing.yml'
      - 'containers/api-proxy/routing-*'
      - 'containers/api-proxy/fixtures/routing-contract/**'
      - 'containers/api-proxy/server.js'
      - 'containers/api-proxy/server-factory.js'
      - 'containers/api-proxy/startup.js'
      - 'containers/api-proxy/providers/copilot.js'
      - 'src/routing/**'
      - 'src/cli-workflow.ts'
      - 'src/compose-generator.ts'
      - 'src/commands/resolve-credentials.ts'
      - 'src/config-file.ts'
      - 'src/config-mapper.ts'
      - 'src/schema-validator.ts'
      - 'src/services/api-proxy-env-config.ts'
      - 'src/services/api-proxy-service-config.ts'
      - 'src/services/agent-environment/tool-specific-environment.ts'
      - 'src/services/credentials/copilot-credential-env.ts'
      - 'src/services/router-service.ts'
      - 'tests/integration/model-routing.test.ts'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  model-routing:
    name: Exercise live routing and Copilot inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AWF
        run: npm run build

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run router/API-proxy planning smoke
        run: npm run test:integration -- --runInBand model-routing.test.ts

      - name: Run a routed Copilot inference through AWF
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROUTING_DIR="${RUNNER_TEMP}/model-routing"
          mkdir -m 700 -p "$ROUTING_DIR"
          cat > "${ROUTING_DIR}/conversation.json" <<'JSON'
          [{"role":"user","parts":[{"text":"Reply with exactly ROUTED_OK."}]}]
          JSON
          cat > "${ROUTING_DIR}/awf-config.yml" <<YAML
          experimental:
            modelRouting: true
          network:
            allowDomains:
              - api.githubcopilot.com
          apiProxy:
            enabled: true
            allowedModels:
              - github-copilot/claude-haiku-4.5
            routing:
              objective:
                goal: cost
                mode: balanced
              task:
                conversationFile: ${ROUTING_DIR}/conversation.json
          container:
            images:
              agent: ghcr.io/github/gh-aw-firewall/agent:0.28.27@sha256:8d14865f96d57d9b4f22b30b3e148d2d926384f0aa543a139f15593e450f0e90
              apiProxy: ghcr.io/github/gh-aw-firewall/api-proxy:0.28.27@sha256:b767b95ad787fae126e0224e547e31daa22950aaa4f03c34e1224f3ce80f314e
              squid: ghcr.io/github/gh-aw-firewall/squid:0.28.27@sha256:c89d35cbc15c1c8614cc01da321a26a0685a71b51858965ce6fdd78252df64a9
              router: ghcr.io/githubnext/gh-aw-router:latest@sha256:d1612d0eaec3fa8f14c38bbd0a6a0682732fc9f83b7fec94219d3e757a048270
          YAML

          ROUTED_COMMAND="$(cat <<'SCRIPT'
          set -euo pipefail
          test -n "${COPILOT_API_URL:-}" || { echo "COPILOT_API_URL is missing" >&2; exit 1; }
          response="$(curl --fail --silent --show-error --max-time 120 \
            -H "Content-Type: application/json" \
            --data "{\"model\":\"claude-haiku-4.5\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly ROUTED_OK.\"}],\"max_tokens\":16,\"stream\":false}" \
            "${COPILOT_API_URL}/chat/completions")"
          node -e '
            const assert = require("node:assert/strict");
            const result = JSON.parse(process.argv[1]);
            const text = result.choices?.[0]?.message?.content;
            assert.equal(typeof text, "string", "Copilot response contained no message text");
            assert.match(text, /ROUTED_OK/, "Copilot did not return the expected smoke response");
            console.log("ROUTED_COPILOT_INFERENCE=passed model=claude-haiku-4.5");
          ' "$response"
          SCRIPT
          )"
          sudo --preserve-env=COPILOT_GITHUB_TOKEN,GITHUB_WORKSPACE,HOME,PATH \
            node dist/cli.js --config "${ROUTING_DIR}/awf-config.yml" -- bash -euc "$ROUTED_COMMAND"

      - name: Show Docker state on failure
        if: failure()
        run: |
          docker ps -a
          docker network ls
