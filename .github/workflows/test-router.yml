name: Router Tests

on:
  push:
    branches: [main]
    paths:
      - 'containers/router/**'
      - '.github/workflows/test-router.yml'
  pull_request:
    branches: [main]
    paths:
      - 'containers/router/**'
      - '.github/workflows/test-router.yml'
  schedule:
    # Weekly, so that govulncheck reports new advisories without a code change
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-router-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: containers/router

jobs:
  go:
    name: Go vet and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: containers/router/go.mod
          # The module has no dependencies, so there is no go.sum to key a cache on.
          cache: false

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Run tests
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Run tests with the race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Check for known vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  container:
    name: Container contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: containers/router/go.mod
          cache: false

      - name: Build the image
        run: |
          docker build \
            --build-arg OPENAPI_SHA256="$(sha256sum openapi.yaml | cut -d ' ' -f 1)" \
            --tag gh-aw-router:test .

      - name: Run container tests
        env:
          GH_AW_ROUTER_TEST_IMAGE: gh-aw-router:test
        run: go test -count=1 -run '^TestContainer' -v ./...
