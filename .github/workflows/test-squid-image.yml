name: Squid Image Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'containers/squid/**'
      - '.github/workflows/test-squid-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-squid-image:
    name: Validate Squid Image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build Squid image (${{ matrix.platform }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./containers/squid
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: awf-squid-test:pr

      - name: Verify pre-ClientHello EOF guard with half-closed clients enabled
        run: |
          set -eu
          docker network create awf-squid-eof-test
          trap 'docker rm -f awf-squid-eof-proxy awf-squid-eof-target >/dev/null 2>&1 || true; docker network rm awf-squid-eof-test >/dev/null 2>&1 || true' EXIT

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/squid-eof-key.pem" \
            -out "$RUNNER_TEMP/squid-eof-cert.pem" \
            -subj /CN=awf-squid-eof-test -days 1
          chmod 644 "$RUNNER_TEMP/squid-eof-key.pem" "$RUNNER_TEMP/squid-eof-cert.pem"
          cat > "$RUNNER_TEMP/squid-eof.conf" <<'EOF'
          acl all src all
          acl step1 at_step SslBump1
          acl CONNECT method CONNECT
          acl SSL_ports port 443 8443
          acl Safe_ports port 80 443 8443
          http_port 0.0.0.0:3128 ssl-bump cert=/etc/squid/squid-eof-cert.pem key=/etc/squid/squid-eof-key.pem generate-host-certificates=off
          http_access deny !Safe_ports
          http_access deny CONNECT !SSL_ports
          http_access allow all
          ssl_bump peek step1
          ssl_bump splice all
          cache deny all
          cache_log stdio:/dev/stderr
          access_log stdio:/dev/stdout
          half_closed_clients on
          pid_filename none
          EOF

          docker run --detach \
            --name awf-squid-eof-target \
            --network awf-squid-eof-test \
            --network-alias eof-target \
            --entrypoint /bin/sh \
            awf-squid-test:pr \
            -c 'while true; do nc -l -p 8443 >/dev/null; done'
          for _ in $(seq 1 30); do
            if docker exec awf-squid-eof-target nc -z 127.0.0.1 8443; then
              break
            fi
            sleep 1
          done
          docker exec awf-squid-eof-target nc -z 127.0.0.1 8443 || {
            docker logs awf-squid-eof-target
            exit 1
          }
          docker create \
            --name awf-squid-eof-proxy \
            --network awf-squid-eof-test \
            --publish 127.0.0.1:3128:3128 \
            awf-squid-test:pr
          docker cp "$RUNNER_TEMP/squid-eof.conf" awf-squid-eof-proxy:/etc/squid/squid.conf
          docker cp "$RUNNER_TEMP/squid-eof-cert.pem" awf-squid-eof-proxy:/etc/squid/squid-eof-cert.pem
          docker cp "$RUNNER_TEMP/squid-eof-key.pem" awf-squid-eof-proxy:/etc/squid/squid-eof-key.pem
          docker start awf-squid-eof-proxy

          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 3128; then
              break
            fi
            sleep 1
          done
          nc -z 127.0.0.1 3128 || {
            docker logs awf-squid-eof-proxy
            exit 1
          }

          python3 - <<'PY'
          import socket

          proxy = ('127.0.0.1', 3128)
          request = b'CONNECT eof-target:8443 HTTP/1.1\r\nHost: eof-target:8443\r\n\r\n'
          for wait_for_response in (False, True):
              for half_close in (False, True):
                  for _ in range(5):
                      with socket.create_connection(proxy, timeout=5) as sock:
                          sock.settimeout(10)
                          sock.sendall(request)
                          if wait_for_response:
                              response = b''
                              while b'\r\n\r\n' not in response:
                                  chunk = sock.recv(4096)
                                  if not chunk:
                                      raise SystemExit('proxy closed before CONNECT response')
                                  response += chunk
                              if b' 200 ' not in response.split(b'\r\n', 1)[0]:
                                  raise SystemExit('allowed CONNECT was rejected')
                          if half_close:
                              sock.shutdown(socket.SHUT_WR)
                              while sock.recv(4096):
                                  pass
          PY

          if [ "$(docker inspect --format='{{.State.Running}}' awf-squid-eof-proxy)" != true ]; then
            docker logs awf-squid-eof-proxy
            echo "::error::Squid exited after a CONNECT client closed before ClientHello"
            exit 1
          fi

      - name: Assert Berkeley DB / Sleepycat packages absent
        run: |
          # apk info lists all installed packages in the Alpine image.
          # Any hit means a Berkeley DB package crept back in — fail fast.
          FOUND=$(docker run --rm --user root --entrypoint sh awf-squid-test:pr -c \
            'apk info 2>/dev/null | grep -iE "^(db|libdb|db5|sleepycat|berkeley)" || true')
          if [ -n "$FOUND" ]; then
            echo "::error::Berkeley DB / Sleepycat packages detected in squid image:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK: No Berkeley DB / Sleepycat packages detected"

      - name: Assert no Berkeley DB shared libraries in filesystem
        run: |
          FOUND=$(docker run --rm --user root --entrypoint sh awf-squid-test:pr -c \
            'find / -xdev -name "libdb*.so*" 2>/dev/null || true')
          if [ -n "$FOUND" ]; then
            echo "::error::Berkeley DB shared libraries found in squid image filesystem:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK: No libdb*.so* shared libraries found"

      - name: Assert proxy user exists at UID 13
        run: |
          ENTRY=$(docker run --rm --user root --entrypoint sh awf-squid-test:pr -c \
            'getent passwd proxy')
          echo "passwd entry: $ENTRY"
          # Format: proxy:x:13:13:...
          UID_VAL=$(echo "$ENTRY" | cut -d: -f3)
          if [ "$UID_VAL" != "13" ]; then
            echo "::error::proxy user has UID $UID_VAL, expected 13"
            exit 1
          fi
          echo "OK: proxy user has UID 13"

      - name: Assert proxy group exists at GID 13
        run: |
          ENTRY=$(docker run --rm --user root --entrypoint sh awf-squid-test:pr -c \
            'getent group proxy')
          echo "group entry: $ENTRY"
          # Format: proxy:x:13:
          GID_VAL=$(echo "$ENTRY" | cut -d: -f3)
          if [ "$GID_VAL" != "13" ]; then
            echo "::error::proxy group has GID $GID_VAL, expected 13"
            exit 1
          fi
          echo "OK: proxy group has GID 13"

      - name: Assert squid binary is present and executable
        run: |
          docker run --rm --user root --entrypoint sh awf-squid-test:pr -c \
            'squid --version 2>&1 | head -1'
          echo "OK: squid binary is present"
