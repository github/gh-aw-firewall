[project]
name = "gh-aw-router"
version = "0.1.3"
description = "Standalone classification planning and model routing service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = ["ai", "model-routing", "llm", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
gh-aw-router = "gh_aw_router.cli:main"

[project.urls]
Homepage = "https://github.com/githubnext/gh-aw-router"
Issues = "https://github.com/githubnext/gh-aw-router/issues"
Repository = "https://github.com/githubnext/gh-aw-router"

[build-system]
requires = ["uv_build>=0.8.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    ".dockerignore",
    ".gitattributes",
    ".github/**",
    ".gitignore",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "Dockerfile",
    "SECURITY.md",
    "examples/**",
    "openapi.yaml",
    "requirements.lock",
    "routing/**",
    "tests/**",
    "uv.lock",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "jsonschema>=4.23,<5",
    "pytest>=9,<10",
    "pyyaml>=6,<7",
    "ruff>=0.15,<0.17",
    "ty>=0.0.49,<0.1",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "docker: opt-in Docker acceptance tests (requires --run-docker)",
    "release: opt-in isolated distribution tests (requires --run-release)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "DTZ",
    "E",
    "F",
    "FA",
    "FURB",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "TID",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src", "tests"]
